tribench {
  # Framework version
  version = "1.0.0"
  
  # Application paths
  app {
    path {
      home = ${PWD}
      apps = ${tribench.app.path.home}"/apps"
      config = ${tribench.app.path.home}"/config" 
      datagens = ${tribench.app.path.home}"/datagens"
      datasets = ${tribench.app.path.home}"/datasets"
      downloads = ${tribench.app.path.home}"/downloads"
      lib = ${tribench.app.path.home}"/lib"
      log = ${tribench.app.path.home}"/log"
      results = ${tribench.app.path.home}"/results"
      systems = ${tribench.app.path.home}"/systems"
      utils = ${tribench.app.path.home}"/utils"
    }
  }
  
  # Dataset management configuration
  datasets {
    dir = ${tribench.app.path.datasets}
    registry = ${tribench.datasets.dir}"/registry.yaml"
    
    # TPC-H configuration
    tpch {
      generator = "tpch-dbgen"
      docker_image = "ghcr.io/scalytics/tpch-docker:latest"
      version = "3.0.0"
      
      scale_factors = ["tiny", "1", "10", "100"]
      formats = ["parquet", "csv"]
      default_format = "parquet"
      
      # Expected row counts for validation
      row_counts {
        tiny {
          nation = 25
          region = 5
          customer = 1500
          supplier = 100
          part = 2000
          partsupp = 8000
          orders = 15000
          lineitem = 60175
        }
        "1" {
          nation = 25
          region = 5
          customer = 150000
          supplier = 10000
          part = 200000
          partsupp = 800000
          orders = 1500000
          lineitem = 6001215
        }
        "10" {
          nation = 25
          region = 5
          customer = 1500000
          supplier = 100000
          part = 2000000
          partsupp = 8000000
          orders = 15000000
          lineitem = 59986052
        }
      }
    }
    
    # Data loading configuration
    loading {
      batch_size = 1000
      parallel_tables = 1
      validate_after_load = true
    }
  }
  
  # Default system configurations
  systems {
    trino {
      version = "434"
      coordinator {
        host = "localhost"
        host = ${?TRINO_HOST}
        port = 8080
        port = ${?TRINO_PORT}
        user = "admin"
        user = ${?TRINO_USER}
        password = ""
        password = ${?TRINO_PASSWORD}
        jvm {
          heap = "4G"
          opts = ["-server", "-XX:+UseG1GC"]
        }
      }
      workers = []
      catalogs {
        memory {
          connector = "memory"
        }
        tpch {
          connector = "tpch"
          tpch.splits-per-node = 4
        }
        iceberg {
          connector = "iceberg"
          hive.metastore.uri = "thrift://localhost:9083"
          hive.metastore.uri = "thrift://"${?HIVE_METASTORE_HOST}":"${?HIVE_METASTORE_PORT}
          iceberg.catalog.type = "hive"
        }
      }
    }
    
    minio {
      version = "latest"
      host = localhost
      host = ${?MINIO_HOST}
      port = 9000
      port = ${?MINIO_PORT}
      console_port = 9001
      console_port = ${?MINIO_CONSOLE_PORT}
      access_key = "minioadmin"
      access_key = ${?MINIO_ACCESS_KEY}
      secret_key = "minioadmin"
      secret_key = ${?MINIO_SECRET_KEY}
      region = "us-east-1"
      region = ${?MINIO_REGION}
      
      # Default buckets to create
      buckets = ["warehouse", "datasets"]
      
      # Docker configuration
      docker {
        image = "minio/minio"
        service_name = "tribench-minio"
        data_dir = ${tribench.app.path.systems}"/minio/data"
        config_dir = ${tribench.app.path.systems}"/minio/config"
        # Docker environment variables for MinIO
        root_user = "admin"
        root_user = ${?MINIO_ROOT_USER}
        root_password = "password"
        root_password = ${?MINIO_ROOT_PASSWORD}
      }
    }
    
    postgresql {
      version = "15"
      host = "localhost"
      host = ${?POSTGRES_HOST}
      port = 5432
      port = ${?POSTGRES_PORT}
      database = "metastore"
      database = ${?POSTGRES_DB}
      username = "hive"
      username = ${?POSTGRES_USER}
      password = "hivepassword"
      password = ${?POSTGRES_PASSWORD}
      
      # Docker configuration
      docker {
        image = "postgres"
        service_name = "tribench-postgresql-15"
        data_dir = ${tribench.app.path.systems}"/postgresql/data"
      }
      
      # Additional databases
      databases {
        metastore = {
          name = "metastore"
          name = ${?POSTGRES_DB}
          user = "hive"
          user = ${?POSTGRES_USER}
          password = "hivepassword"
          password = ${?POSTGRES_PASSWORD}
        }
        results = {
          name = "tribench"
          name = ${?RESULTS_DB_NAME}
          user = "tribench"
          user = ${?RESULTS_DB_USER}
          password = "tribench"
          password = ${?RESULTS_DB_PASSWORD}
        }
      }
    }
    
    hive_metastore {
      version = "4.0.0"
      host = "localhost"
      port = 9083
      
      # Metastore warehouse directory (uses MinIO S3-compatible storage)
      warehouse_dir = "s3a://warehouse/"
      
      # Docker configuration
      docker {
        image = "apache/hive"
        tag = "4.0.0"
        service_name = "tribench-hive-metastore"
        network = "tribench-network"
      }
      
      # PostgreSQL backend configuration
      backend {
        type = "postgres"
        host = ${tribench.systems.postgresql.host}
        port = ${tribench.systems.postgresql.port}
        database = ${tribench.systems.postgresql.database}
        username = ${tribench.systems.postgresql.username}
        password = ${tribench.systems.postgresql.password}
      }
    }
  }
  
  # Database connections for results storage
  database {
    results {
      driver = "org.postgresql.Driver"
      url = "jdbc:postgresql://localhost:5432/tribench"
      username = "tribench"
      password = "tribench"
      pool {
        initial_size = 2
        max_size = 10
      }
    }
  }
  
  # Monitoring configuration
  monitoring {
    enabled = true
    interval = "5s"
    metrics = ["cpu", "memory", "disk", "network"]
    
    prometheus {
      enabled = false
      port = 9090
    }
    
    grafana {
      enabled = false
      port = 3000
    }
  }
  
  # Experiment execution settings
  execution {
    timeout = "1h"
    retry_failed = true
    max_retries = 3
    parallel_experiments = 1
    
    # Query execution settings
    query {
      timeout = "30m"
      max_result_rows = 1000000
      result_validation = true
    }
  }
  
  # Result storage and archiving
  results {
    storage {
      format = "json"
      compress = true
    }
    
    archiving {
      enabled = true
      retention_days = 90
      compression = "gzip"
    }
    
    analysis {
      auto_generate_reports = true
      plot_formats = ["png", "svg"]
    }
  }
}
