tribench {
  # Framework version
  version = "1.0.0"
  
  # Application paths
  app {
    path {
      home = ${PWD}
      apps = ${tribench.app.path.home}"/apps"
      config = ${tribench.app.path.home}"/config" 
      datagens = ${tribench.app.path.home}"/datagens"
      datasets = ${tribench.app.path.home}"/datasets"
      downloads = ${tribench.app.path.home}"/downloads"
      lib = ${tribench.app.path.home}"/lib"
      log = ${tribench.app.path.home}"/log"
      results = ${tribench.app.path.home}"/results"
      systems = ${tribench.app.path.home}"/systems"
      utils = ${tribench.app.path.home}"/utils"
    }
  }
  
  # =============================================================================
  # Framework Defaults (from lib/tribench/defaults.py)
  # =============================================================================
  # These values define the framework's built-in defaults. They can be overridden
  # in host-specific configs or experiment configurations.
  # See lib/tribench/defaults.py for the complete set of defaults used by the framework.
  
  defaults {
    # Host addresses (Defaults.Hosts)
    hosts {
      localhost = "localhost"
      localhost_ip = "127.0.0.1"
    }
    
    # Port numbers (Defaults.Ports)
    ports {
      trino = 8080
      minio_api = 9000
      minio_console = 9001
      postgresql = 5432
      hive_metastore = 9083
    }
    
    # Service/container names (Defaults.ServiceNames)
    service_names {
      trino = "tribench-trino"
      minio = "tribench-minio"
      postgresql = "tribench-postgresql"
      hive_metastore = "tribench-hive-metastore"
      network = "tribench-network"
    }
    
    # Kubernetes configuration (Defaults.Kubernetes)
    kubernetes {
      context = "kind-tribench"
      namespace = "tribench"
    }
    
    # Timeout values in seconds (Defaults.Timeouts)
    timeouts {
      k8s_deployment = 300
      k8s_pod_ready = 120
      trino = 120
      minio = 60
      postgresql = 60
      hive_metastore = 120
      query = 300
      storage = 30
      cli = 120
      default = 60
    }
    
    # Retry and batch configuration (Defaults.Retry)
    retry {
      max_retries {
        k8s = 30
        minio = 10
        storage = 3
        default = 3
      }
      intervals {
        k8s_poll = 10
        minio_retry = 2
        health_check = 5
        port_forward_startup = 2
        process_kill = 1
      }
      batch_sizes {
        analysis = 1000
        storage = 1000
        data_small = 1000
        data_medium = 2000
        data_large = 5000
        data_xlarge = 10000
      }
    }
    
    # Credentials (Defaults.Credentials) - for development/testing only
    credentials {
      minio {
        access_key = "minioadmin"
        secret_key = "minioadmin"
      }
      postgresql {
        user = "tribench"
        password = "tribench"
        database = "tribench"
      }
      trino {
        user = "tribench"
      }
      hive_metastore {
        db_name = "metastore"
        db_user = "hive"
        db_password = "hivepassword"
      }
    }
  }
  
  # Dataset management configuration
  datasets {
    dir = ${tribench.app.path.datasets}
    registry = ${tribench.datasets.dir}"/registry.yaml"
    
    # TPC-H configuration
    tpch {
      generator = "tpch-dbgen"
      docker_image = "ghcr.io/scalytics/tpch-docker:latest"
      version = "3.0.0"
      
      scale_factors = ["tiny", "1", "10", "100"]
      formats = ["parquet", "csv"]
      default_format = "parquet"
      
      # Expected row counts for validation
      row_counts {
        tiny {
          nation = 25
          region = 5
          customer = 1500
          supplier = 100
          part = 2000
          partsupp = 8000
          orders = 15000
          lineitem = 60175
        }
        "1" {
          nation = 25
          region = 5
          customer = 150000
          supplier = 10000
          part = 200000
          partsupp = 800000
          orders = 1500000
          lineitem = 6001215
        }
        "10" {
          nation = 25
          region = 5
          customer = 1500000
          supplier = 100000
          part = 2000000
          partsupp = 8000000
          orders = 15000000
          lineitem = 59986052
        }
      }
    }
    
    # Data loading configuration
    loading {
      # Batch size defaults to 1000 (from Defaults.Retry.DATA_BATCH_SIZE_SMALL)
      batch_size = 1000
      parallel_tables = 1
      validate_after_load = true
    }
  }
  
  # =============================================================================
  # System Configurations
  # =============================================================================
  # These configurations override framework defaults for specific deployments.
  # If not specified, values from tribench.defaults (above) are used.
  
  # Default system configurations
  systems {
    trino {
      version = "434"
      coordinator {
        # Host/port can be overridden via environment variables or host configs
        # Defaults: localhost:8080 (from Defaults.Trino)
        host = "localhost"
        host = ${?TRINO_HOST}
        port = 8080
        port = ${?TRINO_PORT}
        # User defaults to "tribench" (from Defaults.Trino.USER)
        user = "admin"
        user = ${?TRINO_USER}
        password = ""
        password = ${?TRINO_PASSWORD}
        jvm {
          heap = "2G"
          opts = ["-server", "-XX:+UseG1GC"]
        }
      }
      workers = []
      catalogs {
        memory {
          connector = "memory"
        }
        tpch {
          connector = "tpch"
          tpch.splits-per-node = 4
        }
        iceberg {
          connector = "iceberg"
          hive.metastore.uri = "thrift://localhost:9083"
          hive.metastore.uri = "thrift://"${?HIVE_METASTORE_HOST}":"${?HIVE_METASTORE_PORT}
          iceberg.catalog.type = "hive"
        }
      }
    }
    
    minio {
      version = "latest"
      # Defaults: localhost:9000 (from Defaults.MinIO)
      host = localhost
      host = ${?MINIO_HOST}
      port = 9000
      port = ${?MINIO_PORT}
      console_port = 9001
      console_port = ${?MINIO_CONSOLE_PORT}
      # Credentials default to "minioadmin" (from Defaults.Credentials)
      access_key = "minioadmin"
      access_key = ${?MINIO_ACCESS_KEY}
      secret_key = "minioadmin"
      secret_key = ${?MINIO_SECRET_KEY}
      region = "us-east-1"
      region = ${?MINIO_REGION}
      
      # Default buckets to create
      buckets = ["warehouse", "datasets"]
      
      # Docker configuration
      docker {
        image = "minio/minio"
        # Service name defaults to "tribench-minio" (from Defaults.ServiceNames)
        service_name = "tribench-minio"
        data_dir = ${tribench.app.path.systems}"/minio/data"
        config_dir = ${tribench.app.path.systems}"/minio/config"
        # Network defaults to "tribench-network" (from Defaults.ServiceNames.NETWORK)
        network = "tribench-network"
        # Docker environment variables for MinIO
        root_user = "admin"
        root_user = ${?MINIO_ROOT_USER}
        root_password = "password"
        root_password = ${?MINIO_ROOT_PASSWORD}
      }
    }
    
    postgresql {
      version = "15"
      # Defaults: localhost:5432 (from Defaults.PostgreSQL)
      host = "localhost"
      host = ${?POSTGRES_HOST}
      port = 5432
      port = ${?POSTGRES_PORT}
      # Database/credentials default to "tribench" (from Defaults.Credentials)
      database = "metastore"
      database = ${?POSTGRES_DB}
      username = "hive"
      username = ${?POSTGRES_USER}
      password = "hivepassword"
      password = ${?POSTGRES_PASSWORD}
      
      # Docker configuration
      docker {
        image = "postgres"
        # Service name defaults to "tribench-postgresql" (from Defaults.ServiceNames)
        service_name = "tribench-postgresql-15"
        data_dir = ${tribench.app.path.systems}"/postgresql/data"
        # Network defaults to "tribench-network" (from Defaults.ServiceNames.NETWORK)
        network = "tribench-network"
      }
      
      # Additional databases
      databases {
        metastore = {
          name = "metastore"
          name = ${?POSTGRES_DB}
          user = "hive"
          user = ${?POSTGRES_USER}
          password = "hivepassword"
          password = ${?POSTGRES_PASSWORD}
        }
        results = {
          name = "tribench"
          name = ${?RESULTS_DB_NAME}
          user = "tribench"
          user = ${?RESULTS_DB_USER}
          password = "tribench"
          password = ${?RESULTS_DB_PASSWORD}
        }
      }
    }
    
    hive_metastore {
      version = "4.0.0"
      # Defaults: localhost:9083 (from Defaults.HiveMetastore)
      host = "localhost"
      port = 9083
      
      # Metastore warehouse directory (uses MinIO S3-compatible storage)
      warehouse_dir = "s3a://warehouse/"
      
      # Docker configuration
      docker {
        image = "apache/hive"
        tag = "4.0.0"
        # Service name defaults to "tribench-hive-metastore" (from Defaults.ServiceNames)
        service_name = "tribench-hive-metastore"
        # Network defaults to "tribench-network" (from Defaults.ServiceNames.NETWORK)
        network = "tribench-network"
      }
      
      # PostgreSQL backend configuration
      backend {
        type = "postgres"
        host = ${tribench.systems.postgresql.host}
        port = ${tribench.systems.postgresql.port}
        database = ${tribench.systems.postgresql.database}
        username = ${tribench.systems.postgresql.username}
        password = ${tribench.systems.postgresql.password}
      }
    }
  }
  
  # Kubernetes deployment configuration
  kubernetes {
    # Context defaults to "kind-tribench" (from Defaults.Kubernetes.CONTEXT)
    context = "kind-tribench"
    # Namespace defaults to "tribench" (from Defaults.Kubernetes.NAMESPACE)
    namespace = "tribench"
    
    # Helm chart configuration
    helm {
      trino_chart = "trinodb/trino"
      trino_release = "tribench-trino"
      minio_chart = "minio/minio"
    }
    
    # Deployment timeouts (from Defaults.Timeouts)
    timeouts {
      deployment = 300  # K8S_DEPLOYMENT timeout
      pod_ready = 120   # K8S_POD_READY timeout
    }
  }
  
  # Database connections for results storage
  database {
    results {
      driver = "org.postgresql.Driver"
      url = "jdbc:postgresql://localhost:5432/tribench"
      username = "tribench"
      password = "tribench"
      pool {
        initial_size = 2
        max_size = 10
      }
    }
  }
  
  # Monitoring configuration
  monitoring {
    enabled = true
    interval = "5s"
    metrics = ["cpu", "memory", "disk", "network"]

  }
  
  # Experiment execution settings
  execution {
    timeout = "1h"
    retry_failed = true
    # Max retries defaults to 3 (from Defaults.Retry.DEFAULT_MAX_RETRIES)
    max_retries = 3
    parallel_experiments = 1
    
    # Query execution settings
    query {
      # Query timeout defaults to 300s (from Defaults.Timeouts.QUERY)
      timeout = "30m"
      max_result_rows = 1000000
      result_validation = true
      # Number of concurrent queries per experiment (1 = sequential)
      # Higher values simulate concurrent workloads but affect benchmarking reproducibility
      parallel_queries = 1
    }
  }
  
  # Result storage and archiving
  results {
    storage {
      format = "json"
      compress = true
    }
    
    archiving {
      enabled = true
      retention_days = 90
      compression = "gzip"
    }
    
    analysis {
      auto_generate_reports = true
      plot_formats = ["png", "svg"]
    }
  }
}
