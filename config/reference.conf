# ==============================================================================
# TriBench Reference Configuration
# ==============================================================================
# This file defines the framework's default configuration.
# DO NOT edit this file directly for your deployment - instead create a 
# host-specific config file in config/hosts/{hostname}.conf
#
# See config/templates/host-template.conf for examples of what can be overridden.
# ==============================================================================

tribench {
  # Framework version
  version = "1.0.0"
  
  # =============================================================================
  # Application Paths
  # =============================================================================
  app {
    path {
      home = ${PWD}
      apps = ${tribench.app.path.home}"/queries"
      config = ${tribench.app.path.home}"/config" 
      datagens = ${tribench.app.path.home}"/datagens"
      datasets = ${tribench.app.path.home}"/datasets"
      downloads = ${tribench.app.path.home}"/downloads"
      lib = ${tribench.app.path.home}"/lib"
      log = ${tribench.app.path.home}"/log"
      results = ${tribench.app.path.home}"/results"
      systems = ${tribench.app.path.home}"/systems"
      utils = ${tribench.app.path.home}"/utils"
    }
  }

  # =============================================================================
  # Bundle Paths
  # =============================================================================
  # These variables point to the active bundle's directories.
  # When a bundle is active (bundle.yaml found by walking up from CWD or via
  # --bundle flag), override tribench.bundle.root in the bundle's application.conf.
  bundle {
    root = ${tribench.app.path.home}
    bundles = ${tribench.app.path.home}"/bundles"
    apps = ${tribench.bundle.root}"/queries"
    config = ${tribench.bundle.root}"/config"
    experiments = ${tribench.bundle.root}"/experiments"
    datasets = ${tribench.bundle.root}"/datasets"
    results = ${tribench.bundle.root}"/results"
    log = ${tribench.bundle.root}"/log"
  }
  
  # =============================================================================
  # Framework Defaults
  # =============================================================================
  defaults {
    # Default deployment backend: "docker" or "kubernetes"
    # Override in host config to use Kubernetes by default
    backend = "docker"
    
    # Host addresses
    hosts {
      localhost = "localhost"
      localhost_ip = "127.0.0.1"
    }
    
    # Port numbers
    ports {
      trino = 8080
      minio_api = 9000
      minio_console = 9001
      postgresql = 5432
      hive_metastore = 9083
    }
    
    # Service/container names
    service_names {
      trino = "tribench-trino"
      minio = "tribench-minio"
      postgresql = "tribench-postgresql"
      hive_metastore = "tribench-hive-metastore"
      network = "tribench-network"
    }
  }
  
  # =============================================================================
  # Dataset Configuration
  # =============================================================================
  datasets {
    dir = ${tribench.app.path.datasets}
    registry = ${tribench.datasets.dir}"/registry.yaml"
  }
  
  # =============================================================================
  # System Configurations
  # =============================================================================
  systems {
    # ---------------------------------------------------------------------------
    # Trino Configuration
    # ---------------------------------------------------------------------------
    trino {
      version = "434"
      
      coordinator {
        # Connection details (can be overridden via environment variables)
        host = "localhost"
        host = ${?TRINO_HOST}
        port = 8080
        port = ${?TRINO_PORT}
        user = "admin"
        user = ${?TRINO_USER}
        password = ""
        password = ${?TRINO_PASSWORD}
        
        # Enabled by default (for templates)
        enabled = true
        
        # JVM configuration
        jvm {
          heap = "2G"
          opts = [
            "-server"
            "-XX:InitialRAMPercentage=80"
            "-XX:MaxRAMPercentage=80"
            "-XX:G1HeapRegionSize=32M"
            "-XX:+ExplicitGCInvokesConcurrent"
            "-XX:+HeapDumpOnOutOfMemoryError"
            "-XX:+ExitOnOutOfMemoryError"
            "-XX:-OmitStackTraceInFastThrow"
            "-XX:ReservedCodeCacheSize=512M"
            "-XX:PerMethodRecompilationCutoff=10000"
            "-XX:PerBytecodeRecompilationCutoff=10000"
            "-Djdk.attach.allowAttachSelf=true"
            "-Djdk.nio.maxCachedBufferSize=2000000"
          ]
        }
      }
      
      # Node properties (used in templates)
      node {
        environment = "production"
        data_dir = "/data"
      }
      
      # Query configuration (used in templates)
      query {
        max_memory = "4GB"
        max_memory_per_node = "1GB"
      }
      
      # Worker configuration (empty by default - single node)
      workers = []
      
      # Catalog configurations
      catalogs {
        memory {
          connector = "memory"
        }
        tpch {
          connector = "tpch"
          tpch.splits-per-node = 4
        }
        iceberg {
          connector = "iceberg"
          hive.metastore.uri = "thrift://localhost:9083"
          hive.metastore.uri = "thrift://"${?HIVE_METASTORE_HOST}":"${?HIVE_METASTORE_PORT}
          iceberg.catalog.type = "hive"
        }
      }
      
      # Docker configuration
      docker {
        network = ${tribench.defaults.service_names.network}
      }
    }
    
    # ---------------------------------------------------------------------------
    # MinIO Configuration
    # ---------------------------------------------------------------------------
    minio {
      version = "latest"
      
      # Connection details (can be overridden via environment variables)
      host = "localhost"
      host = ${?MINIO_HOST}
      port = 9000
      port = ${?MINIO_PORT}
      console_port = 9001
      console_port = ${?MINIO_CONSOLE_PORT}
      
      # Credentials (can be overridden via environment variables)
      access_key = "minioadmin"
      access_key = ${?MINIO_ACCESS_KEY}
      secret_key = "minioadmin"
      secret_key = ${?MINIO_SECRET_KEY}
      region = "us-east-1"
      region = ${?MINIO_REGION}
      
      # Default buckets to create
      buckets = ["warehouse", "datasets"]
      
      # Docker configuration
      docker {
        image = "minio/minio"
        service_name = ${tribench.defaults.service_names.minio}
        data_dir = ${tribench.app.path.systems}"/minio/data"
        config_dir = ${tribench.app.path.systems}"/minio/config"
        network = ${tribench.defaults.service_names.network}
        
        # Docker environment variables
        root_user = "admin"
        root_user = ${?MINIO_ROOT_USER}
        root_password = "password"
        root_password = ${?MINIO_ROOT_PASSWORD}
      }
    }
    
    # ---------------------------------------------------------------------------
    # PostgreSQL Configuration
    # ---------------------------------------------------------------------------
    postgresql {
      version = "15"
      
      # Connection details (can be overridden via environment variables)
      host = "localhost"
      host = ${?POSTGRES_HOST}
      port = 5432
      port = ${?POSTGRES_PORT}
      
      # Docker configuration
      docker {
        image = "postgres"
        service_name = "tribench-postgresql-15"
        data_dir = ${tribench.app.path.systems}"/postgresql/data"
        network = ${tribench.defaults.service_names.network}
      }
      
      # Database configurations
      databases {
        metastore = {
          name = "metastore"
          name = ${?POSTGRES_DB}
          user = "hive"
          user = ${?POSTGRES_USER}
          password = "hivepassword"
          password = ${?POSTGRES_PASSWORD}
        }
        results = {
          name = "tribench"
          name = ${?RESULTS_DB_NAME}
          user = "tribench"
          user = ${?RESULTS_DB_USER}
          password = "tribench"
          password = ${?RESULTS_DB_PASSWORD}
        }
      }
    }
    
    # ---------------------------------------------------------------------------
    # Hive Metastore Configuration
    # ---------------------------------------------------------------------------
    hive_metastore {
      version = "4.0.0"
      
      # Connection details
      host = "localhost"
      port = 9083
      
      # Metastore warehouse directory (uses MinIO S3-compatible storage)
      warehouse_dir = "s3a://warehouse/"
      
      # Docker configuration
      docker {
        image = "apache/hive"
        tag = "4.0.0"
        service_name = ${tribench.defaults.service_names.hive_metastore}
        network = ${tribench.defaults.service_names.network}
      }
      
      # Kubernetes configuration
      kubernetes {
        # Default for local Kind cluster (loaded from local Docker)
        image = "tribench-hive-metastore:"${tribench.systems.hive_metastore.version}
        imagePullPolicy = "Never"
        
        # For cloud clusters, override in host config:
        # image = "us-central1-docker.pkg.dev/tribench/tribench/hive-metastore:"${tribench.systems.hive_metastore.version}
        # imagePullPolicy = "IfNotPresent"
      }
    }
  }
  
  # =============================================================================
  # Kubernetes Deployment Configuration
  # =============================================================================
  kubernetes {
    # Context name from kubectl (defaults to kind-tribench)
    context = "kind-tribench"
    context = ${?TRIBENCH_K8S_CONTEXT}
    
    # Namespace for deployments
    namespace = "tribench"
    namespace = ${?TRIBENCH_K8S_NAMESPACE}
  }
}
