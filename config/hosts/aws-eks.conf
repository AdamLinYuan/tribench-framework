# Amazon Web Services (EKS) Configuration
# Override default settings for AWS deployment

tribench {
  # Cloud provider identification
  cloud_provider = "aws"
  
  systems {
    kubernetes {
      # EKS context (update with your actual context from: kubectl config current-context)
      # Example: your-iam-user@tribench-cluster.us-east-1.eksctl.io
      context = "your-iam-user@tribench-cluster.us-east-1.eksctl.io"
      namespace = "tribench"
      
      # EKS-specific settings
      timeout = 600  # EKS can take longer for initial pod pulls
      
      # Storage class for persistent volumes (EKS default)
      storage_class = "gp2"  # or "gp3" for newer clusters
    }
    
    trino {
      # Increase resources for cloud VMs
      coordinator {
        memory = "6Gi"
        cpu = "2"
      }
      workers {
        count = 3
        memory = "12Gi"
        cpu = "4"
      }
    }
    
    minio {
      # Option 1: Use MinIO on EKS (simple, self-contained)
      enabled = true
      storage = "100Gi"
      storage_class = "gp2"
      
      # Option 2: Use S3 instead (requires additional Iceberg configuration)
      # enabled = false
      # Note: Requires configuring Trino Iceberg connector with S3 credentials
    }
    
    postgresql {
      # Option 1: PostgreSQL on EKS
      storage = "50Gi"
      storage_class = "gp2"
      
      # Option 2: Use RDS PostgreSQL
      # enabled = false
      # external_host = "your-rds-instance.us-east-1.rds.amazonaws.com"
      # external_port = 5432
    }
    
    hive_metastore {
      storage = "10Gi"
      storage_class = "gp2"
    }
  }
  
  monitoring {
    # Kubernetes pod monitoring (metrics-server must be installed on EKS)
    kubernetes {
      enabled = true
      # Install with: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
    }
    
    # Optional: CloudWatch integration (future enhancement)
    cloudwatch {
      enabled = false
    }
  }
}
