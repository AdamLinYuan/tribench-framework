# Microsoft Azure (AKS) Configuration
# Override default settings for Azure deployment

tribench {
  # Cloud provider identification
  cloud_provider = "azure"
  
  systems {
    kubernetes {
      # AKS context (update with your actual context from: kubectl config current-context)
      # Usually just the cluster name, e.g., "tribench-cluster"
      context = "tribench-cluster"
      namespace = "tribench"
      
      # AKS-specific settings
      timeout = 600
      
      # Storage class for persistent volumes (AKS default)
      storage_class = "managed-csi"  # or "default", "managed-premium" for SSD
    }
    
    trino {
      # Increase resources for cloud VMs
      coordinator {
        memory = "6Gi"
        cpu = "2"
      }
      workers {
        count = 3
        memory = "12Gi"
        cpu = "4"
      }
    }
    
    minio {
      # Option 1: Use MinIO on AKS (simple, self-contained)
      enabled = true
      storage = "100Gi"
      storage_class = "managed-csi"
      
      # Option 2: Use Azure Blob Storage (requires additional configuration)
      # enabled = false
      # Note: Requires configuring Trino Iceberg connector with Azure credentials
    }
    
    postgresql {
      # Option 1: PostgreSQL on AKS
      storage = "50Gi"
      storage_class = "managed-csi"
      
      # Option 2: Use Azure Database for PostgreSQL
      # enabled = false
      # external_host = "your-postgres.postgres.database.azure.com"
      # external_port = 5432
    }
    
    hive_metastore {
      storage = "10Gi"
      storage_class = "managed-csi"
    }
  }
  
  monitoring {
    # Kubernetes pod monitoring (metrics-server is pre-installed on AKS)
    kubernetes {
      enabled = true
      # Pre-installed on AKS ✅
    }
    
    # Optional: Azure Monitor integration (future enhancement)
    azure_monitor {
      enabled = false
    }
  }
}
