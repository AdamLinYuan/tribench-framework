# GPG Cluster Configuration (single-node kubeadm)

tribench {
  defaults {
    backend = "kubernetes"
  }

  systems {
    hive_metastore {
      kubernetes {
        # Docker Hub image built for linux/amd64 (GPG Intel Xeon)
        image = "adamlinyuan/hive-metastore:4.0.0-amd64"
        imagePullPolicy = "IfNotPresent"
      }
    }

    trino {
      coordinator {
        jvm {
          heap = "16G"  # node has 64GB RAM total
        }
      }

      query {
        max_memory = "20GB"
        max_memory_per_node = "10GB"
      }

      workers = [
        { name = "worker-1" }
      ]
    }
  }

  # Kubernetes deployment configuration
  kubernetes {
    context = "gpg-cluster"
    namespace = "tribench"
  }
}
