# Local development environment configuration

tribench {
  # Override paths for local development
  app.path {
    downloads = "/tmp/tribench/downloads"
    systems = "/tmp/tribench/systems"
  }
  
  # Local Trino configuration
  systems.trino {
    coordinator {
      host = "localhost"
      port = 8080
      jvm.heap = "2G"  # Smaller heap for local development
    }
    
    # Enable all available catalogs for testing
    catalogs {
      memory {
        connector = "memory"
      }
      tpch {
        connector = "tpch"
        tpch.splits-per-node = 2
      }
      tpcds {
        connector = "tpcds"
        tpcds.splits-per-node = 2  
      }
      iceberg {
        connector = "iceberg"
        iceberg.catalog.type = "hadoop"
        hive.metastore.uri = "thrift://localhost:9083"
      }
    }
  }
  
  # Local MinIO configuration
  systems.minio {
    host = "localhost"
    port = 9000
    console_port = 9001
    data_dir = "/tmp/minio/data"
  }
  
  # Local PostgreSQL for results
  database.results {
    url = "jdbc:postgresql://localhost:5432/tribench_dev"
    username = "dev"
    password = "dev"
  }
  
  # Development-friendly settings
  execution {
    timeout = "10m"  # Shorter timeout for development
    parallel_experiments = 1
    query.timeout = "5m"
  }
  
  # Enable monitoring for development
  monitoring {
    enabled = true
    interval = "10s"
  }
}
