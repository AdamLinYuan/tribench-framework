# Local Kind Cluster Configuration

tribench {
  defaults {
    backend = "kubernetes"
  }
  
  systems {
    trino {
      coordinator {
        jvm {
          heap = "4G"
        }
      }
      
      query {
        max_memory = "8GB"
        max_memory_per_node = "2GB"
      }
      
      workers = [
        { name = "worker-1" }
        { name = "worker-2" }
      ]
    }
  }
  
  # Kubernetes deployment configuration
  kubernetes {
    context = "kind-tribench"
    namespace = "tribench"
  }
}
