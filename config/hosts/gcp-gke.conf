# GCP GKE Configuration

tribench {
  # Default to Kubernetes backend for GKE cluster
  defaults {
    backend = "kubernetes"
  }
  
  systems {
    hive_metastore {
      kubernetes {
        # Use GCP Artifact Registry image for GKE (ARM64 for ARM64 nodes)
        image = "us-central1-docker.pkg.dev/tribench/tribench/hive-metastore:4.0.0-arm64"
        imagePullPolicy = "IfNotPresent"  # Pull from registry if not present
      }
    }
  }
  
  # Kubernetes deployment configuration
  kubernetes {
    context = "gke_tribench_us-central1-a_tribench-cluster"
    namespace = "tribench"
  }
}
