# Google Cloud Platform (GKE) Configuration
# Override default settings for GCP deployment

tribench {
  # Cloud provider identification
  cloud_provider = "gcp"
  
  systems {
    kubernetes {
      # GKE context (update with your actual context from: kubectl config get-contexts)
      context = "gke_YOUR_PROJECT_us-central1_tribench-cluster"
      namespace = "tribench"
      
      # GKE-specific settings
      timeout = 600  # GKE can take longer for initial pod pulls
      
      # Storage class for persistent volumes
      storage_class = "standard-rwo"  # GKE default
    }
    
    trino {
      # Increase resources for cloud VMs
      coordinator {
        memory = "8Gi"
        cpu = "4"
      }
      workers {
        count = 3
        memory = "16Gi"
        cpu = "8"
      }
    }
    
    minio {
      # Option 1: Use MinIO on GKE (simple, self-contained)
      enabled = true
      storage = "100Gi"
      storage_class = "standard-rwo"
      
      # Option 2: Use Google Cloud Storage (GCS) instead
      # enabled = false
      # Note: Requires additional Iceberg configuration for GCS
    }
    
    postgresql {
      # Option 1: PostgreSQL on GKE
      storage = "50Gi"
      storage_class = "standard-rwo"
      
      # Option 2: Use Cloud SQL for PostgreSQL
      # enabled = false
      # external_host = "CLOUD_SQL_IP"
    }
    
    hive_metastore {
      storage = "10Gi"
      storage_class = "standard-rwo"
    }
  }
  
  monitoring {
    # Kubernetes pod monitoring works out-of-box on GKE
    kubernetes {
      enabled = true
      # metrics-server is pre-installed on GKE
    }
    
    # Optional: GCP-specific monitoring
    stackdriver {
      enabled = false  # Future enhancement
    }
  }
}
