# GPG Cluster Configuration (multi-node kubeadm)
# See: docs/GPG/GPG_MULTINODE_DEPLOYMENT.md

tribench {
  defaults {
    backend = "kubernetes"
  }

  systems {
    hive_metastore {
      kubernetes {
        # Docker Hub image built for linux/amd64 (GPG Intel Xeon)
        image = "adamlinyuan/hive-metastore:4.0.0-amd64"
        imagePullPolicy = "IfNotPresent"
      }
    }

    trino {
      coordinator {
        jvm {
          heap = "16G"
        }
      }

      query {
        # Increase max_memory as you add workers (roughly 10GB × number of workers)
        max_memory = "40GB"
        max_memory_per_node = "10GB"
      }

      # Add one entry per worker node
      workers = [
        { name = "worker-1" }
        { name = "worker-2" }
      ]
    }
  }

  kubernetes {
    # Use "gpg-cluster" for single-node, "gpg-multinode" for a dedicated multi-node cluster
    context = "gpg-cluster"
    namespace = "tribench"
    use_persistent_volumes = false
    create_cluster = false
  }
}
