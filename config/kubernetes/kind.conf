# Kubernetes Configuration - kind (Local Development)
#
# This configuration is for running Trino on a local kind cluster
# via Docker Desktop Kubernetes.

kubernetes {
  # Environment type: 'kind' for local, 'school' for university cluster
  environment = "kind"
  
  # Kubernetes namespace to deploy into
  namespace = "default"
  
  # kubectl context name (set by kind)
  context = "kind-tribench"
  
  trino {
    # Trino Docker image
    image = "trinodb/trino:434"
    
    # Coordinator configuration
    coordinator {
      replicas = 1  # Always 1 for coordinator
      
      resources {
        requests {
          cpu = "2"
          memory = "4Gi"
        }
        limits {
          cpu = "2"
          memory = "4Gi"
        }
      }
      
      jvm {
        # Max heap size (should be ~70% of memory limit)
        maxHeapSize = "3G"
        
        # Additional JVM options
        options = [
          "-XX:+UseG1GC"
          "-XX:G1HeapRegionSize=32M"
          "-XX:+ExplicitGCInvokesConcurrent"
        ]
      }
    }
    
    # Worker configuration
    worker {
      replicas = 2  # 2 workers sufficient for dissertation
      
      resources {
        requests {
          cpu = "2"
          memory = "4Gi"
        }
        limits {
          cpu = "2"
          memory = "4Gi"
        }
      }
      
      jvm {
        maxHeapSize = "3G"
        options = [
          "-XX:+UseG1GC"
          "-XX:G1HeapRegionSize=32M"
          "-XX:+ExplicitGCInvokesConcurrent"
        ]
      }
    }
    
    # Trino configuration properties
    config {
      # Query execution settings
      "query.max-memory-per-node" = "2GB"
      "query.max-total-memory-per-node" = "3GB"
      
      # Spill to disk settings
      "spill-enabled" = true
      "spiller-spill-path" = "/tmp/trino/spill"
    }
    
    # Catalog configurations
    catalogs {
      # Iceberg catalog for TPC-H data
      iceberg {
        "connector.name" = "iceberg"
        "iceberg.catalog.type" = "hive_metastore"
        "hive.metastore.uri" = "thrift://hive-metastore:9083"
        
        # S3 (MinIO) configuration
        "fs.native-s3.enabled" = true
        "s3.endpoint" = "http://minio:9000"
        "s3.path-style-access" = true
        "s3.aws-access-key" = "admin"
        "s3.aws-secret-key" = "password"
      }
      
      # Memory connector for testing
      memory {
        "connector.name" = "memory"
      }
      
      # TPC-H connector for baseline comparison
      tpch {
        "connector.name" = "tpch"
      }
    }
  }
  
  # MinIO (S3-compatible storage) configuration
  minio {
    # Storage size for persistent volume
    storage = "10Gi"
    
    # Resource limits
    resources {
      requests {
        cpu = "250m"
        memory = "512Mi"
      }
      limits {
        cpu = "500m"
        memory = "1Gi"
      }
    }
    
    # Access credentials (should be in secrets for production)
    rootUser = "admin"
    rootPassword = "password"
    
    # Buckets to create automatically
    buckets = [
      "warehouse",  # Iceberg data
      "datasets",   # TPC-H parquet files
      "results"     # Experiment results
    ]
  }
  
  # PostgreSQL (Hive Metastore backend) configuration
  postgresql {
    # Storage size for persistent volume
    storage = "5Gi"
    
    # Resource limits
    resources {
      requests {
        cpu = "250m"
        memory = "256Mi"
      }
      limits {
        cpu = "500m"
        memory = "512Mi"
      }
    }
    
    # Database configuration
    auth {
      username = "hive"
      password = "hive"
      database = "metastore"
    }
  }
  
  # Hive Metastore configuration
  hiveMetastore {
    image = "apache/hive:4.0.0"
    
    resources {
      requests {
        cpu = "500m"
        memory = "1Gi"
      }
      limits {
        cpu = "1"
        memory = "2Gi"
      }
    }
    
    # Connection to PostgreSQL
    database {
      type = "postgres"
      host = "postgresql"
      port = 5432
      name = "metastore"
      user = "hive"
      password = "hive"
    }
    
    # S3 (MinIO) warehouse location
    warehouse {
      uri = "s3://warehouse/"
      endpoint = "http://minio:9000"
    }
  }
  
  # Monitoring configuration
  monitoring {
    enabled = true
    
    # Collect metrics every 5 seconds during experiments
    interval = "5s"
    
    # Metrics to collect
    metrics = [
      "pod-cpu",
      "pod-memory",
      "pod-network",
      "trino-queries",
      "trino-tasks"
    ]
  }
  
  # Storage class (kind uses local-path provisioner)
  storageClass = "standard"
  
  # Helm chart versions (for reproducibility)
  helm {
    repos {
      trinodb = "https://trinodb.github.io/charts"
      minio = "https://charts.min.io/"
      bitnami = "https://charts.bitnami.com/bitnami"
    }
    
    versions {
      trino = "latest"  # Or pin: "0.15.0"
      minio = "latest"
      postgresql = "12.x.x"
    }
  }
}

# Include base system configuration
include "../reference.conf"
