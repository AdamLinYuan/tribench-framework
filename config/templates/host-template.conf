# ==============================================================================
# TriBench Host Configuration Template
# ==============================================================================
# This template shows all configurable options that can be overridden in a
# host-specific configuration file.
#
# Copy this file to config/hosts/{your-hostname}.conf and customize as needed.
# Your hostname can be found with: hostname
#
# Only include the values you want to override - all have sensible defaults.
# ==============================================================================

tribench {
  # =============================================================================
  # Framework Defaults
  # =============================================================================
  
  defaults {
    # Default deployment backend: "docker" or "kubernetes"
    # Override to use Kubernetes by default on cluster hosts
    # backend = "kubernetes"
    
    # Host addresses (rarely need to override)
    # hosts {
    #   localhost = "localhost"
    #   localhost_ip = "127.0.0.1"
    # }
    
    # Port numbers (override if you have conflicts)
    # ports {
    #   trino = 8080
    #   minio_api = 9000
    #   minio_console = 9001
    #   postgresql = 5432
    #   hive_metastore = 9083
    # }
  }
  
  # =============================================================================
  # System Configurations
  # =============================================================================
  # Override system-specific settings for your environment
  
  systems {
    # -------------------------------------------------------------------------
    # Trino Configuration
    # -------------------------------------------------------------------------
    trino {
      # Version to use
      # version = "434"
      
      coordinator {
        # Connection details (can use environment variables)
        # host = "localhost"
        # host = ${?TRINO_HOST}
        # port = 8080
        # port = ${?TRINO_PORT}
        # user = "admin"
        # user = ${?TRINO_USER}
        # password = ""
        # password = ${?TRINO_PASSWORD}
        
        # JVM configuration
        # jvm {
        #   heap = "2G"
        #   opts = [
        #     "-server"
        #     "-XX:InitialRAMPercentage=80"
        #     "-XX:MaxRAMPercentage=80"
        #   ]
        # }
      }
      
      # Trino node properties (rarely need to override)
      # node {
      #   environment = "production"
      #   data_dir = "/var/trino/data"
      # }
      
      # Worker configuration (for multi-node Trino clusters)
      # Leave empty for auto-detection in Kubernetes, or specify count/list
      # workers = []  # Default: auto-detects K8s worker nodes
      # workers = 3   # Explicit count: create 3 workers
      # workers = [   # Custom worker configurations
      #   { name = "worker-1" },
      #   { name = "worker-2" },
      #   { name = "worker-3" }
      # ]
      # Note: In Kubernetes, workers are auto-detected from non-control-plane nodes
      #       In Docker, workers are not currently supported (single-node only)
      
      # Query configuration (for advanced tuning)
      # query {
      #   max_memory = "4GB"
      #   max_memory_per_node = "1GB"
      # }
      
      # Catalog configurations
      # catalogs {
      #   iceberg {
      #     connector = "iceberg"
      #     hive.metastore.uri = "thrift://localhost:9083"
      #   }
      # }
    }
    
    # -------------------------------------------------------------------------
    # MinIO Configuration
    # -------------------------------------------------------------------------
    minio {
      # Version to use
      # version = "latest"
      
      # Connection details (can use environment variables)
      # host = "localhost"
      # host = ${?MINIO_HOST}
      # port = 9000
      # port = ${?MINIO_PORT}
      # console_port = 9001
      
      # Credentials (can use environment variables)
      # access_key = "minioadmin"
      # access_key = ${?MINIO_ACCESS_KEY}
      # secret_key = "minioadmin"
      # secret_key = ${?MINIO_SECRET_KEY}
      
      # region = "us-east-1"
      # buckets = ["warehouse", "datasets"]
      
      # Docker configuration
      # docker {
      #   image = "minio/minio"
      #   service_name = "tribench-minio"
      #   root_user = "admin"
      #   root_password = "password"
      # }
    }
    
    # -------------------------------------------------------------------------
    # PostgreSQL Configuration
    # -------------------------------------------------------------------------
    postgresql {
      # Version to use
      # version = "15"
      
      # Connection details (can use environment variables)
      # host = "localhost"
      # host = ${?POSTGRES_HOST}
      # port = 5432
      # port = ${?POSTGRES_PORT}
      
      # Docker configuration
      # docker {
      #   image = "postgres"
      #   service_name = "tribench-postgresql-15"
      # }
      
      # Database configurations
      # databases {
      #   metastore = {
      #     name = "metastore"
      #     user = "hive"
      #     password = "hivepassword"
      #   }
      #   results = {
      #     name = "tribench"
      #     user = "tribench"
      #     password = "tribench"
      #   }
      # }
    }
    
    # -------------------------------------------------------------------------
    # Hive Metastore Configuration
    # -------------------------------------------------------------------------
    hive_metastore {
      # Version to use
      # version = "4.0.0"
      
      # Connection details
      # host = "localhost"
      # port = 9083
      # warehouse_dir = "s3a://warehouse/"
      
      # Docker configuration
      # docker {
      #   image = "apache/hive"
      #   tag = "4.0.0"
      #   service_name = "tribench-hive-metastore"
      # }
      
      # Kubernetes configuration (for cloud deployments)
      kubernetes {
        # For GCP/Cloud clusters: use registry image
        # image = "us-central1-docker.pkg.dev/tribench/tribench/hive-metastore:"${tribench.systems.hive_metastore.version}
        # imagePullPolicy = "IfNotPresent"
        
        # For local Kind clusters: use local image
        # image = "tribench-hive-metastore:"${tribench.systems.hive_metastore.version}
        # imagePullPolicy = "Never"
      }
    }
  }
  
  # =============================================================================
  # Kubernetes Deployment Configuration
  # =============================================================================
  # Only needed when using Kubernetes backend
  
  kubernetes {
    # Kubernetes context name (from kubectl config)
    # For Kind: "kind-tribench"
    # For GKE: "gke_{project}_{zone}_{cluster}"
    # context = "kind-tribench"
    # context = ${?TRIBENCH_K8S_CONTEXT}
    
    # Namespace for deployments
    # namespace = "tribench"
    # namespace = ${?TRIBENCH_K8S_NAMESPACE}
  }
  
  # =============================================================================
  # Application Paths
  # =============================================================================
  # Usually don't need to override these unless you have a custom structure
  
  # app {
  #   path {
  #     home = ${PWD}
  #     datasets = ${tribench.app.path.home}"/datasets"
  #     systems = ${tribench.app.path.home}"/systems"
  #   }
  # }
  
  # =============================================================================
  # Dataset Configuration
  # =============================================================================
  
  # datasets {
  #   dir = ${tribench.app.path.datasets}
  #   registry = ${tribench.datasets.dir}"/registry.yaml"
  # }
}

