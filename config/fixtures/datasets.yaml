# Dataset Definitions  
# This file defines datasets available for benchmarking

datasets:
  # TPC-H datasets
  - name: "tpch-tiny"
    type: "static"
    description: "TPC-H tiny dataset for development and testing"
    format: "parquet"
    location: "${tribench.app.path.datasets}/tpch/tiny"
    size: "1MB"
    tables:
      - customer
      - lineitem
      - nation
      - orders
      - part
      - partsupp
      - region
      - supplier
    metadata:
      scale_factor: 0.01
      row_count: 100
      
  - name: "tpch-sf1"
    type: "generated"
    description: "TPC-H scale factor 1 dataset (1GB)"
    format: "parquet"
    location: "${tribench.app.path.datasets}/tpch/sf1"
    generator: "tpch-dbgen"
    size: "1GB"
    generation:
      scale_factor: 1
      format: "parquet"
      compression: "snappy"
    metadata:
      scale_factor: 1
      row_count: 8000000
      
  - name: "tpch-sf10"
    type: "generated"  
    description: "TPC-H scale factor 10 dataset (10GB)"
    format: "parquet"
    location: "${tribench.app.path.datasets}/tpch/sf10"
    generator: "tpch-dbgen"
    size: "10GB"
    generation:
      scale_factor: 10
      format: "parquet" 
      compression: "snappy"
    metadata:
      scale_factor: 10
      row_count: 80000000
      
  # TPC-DS datasets
  - name: "tpcds-sf1"
    type: "generated"
    description: "TPC-DS scale factor 1 dataset"
    format: "parquet"
    location: "${tribench.app.path.datasets}/tpcds/sf1"
    generator: "tpcds-dsdgen"
    size: "2GB"
    generation:
      scale_factor: 1
      format: "parquet"
      compression: "snappy"
    metadata:
      scale_factor: 1
      
  # Iceberg datasets
  - name: "tpch-sf1-iceberg"
    type: "generated"
    description: "TPC-H SF1 in Iceberg format with schema evolution"
    format: "iceberg"
    location: "${tribench.app.path.datasets}/iceberg/tpch_sf1"
    generator: "tpch-iceberg"
    size: "1GB"
    generation:
      base_dataset: "tpch-sf1"
      format: "iceberg"
      features:
        - schema_evolution
        - time_travel
        - partitioning
    metadata:
      scale_factor: 1
      partitions: ["l_shipdate", "o_orderdate"]
      
  # Custom datasets
  - name: "synthetic-timeseries"
    type: "generated"
    description: "Synthetic time series data for analytical queries"
    format: "parquet"
    location: "${tribench.app.path.datasets}/synthetic/timeseries"
    generator: "synthetic-timeseries"
    size: "500MB"
    generation:
      rows: 10000000
      time_range: "1year"
      metrics: 50
      dimensions: 10
    metadata:
      time_column: "timestamp"
      metric_columns: ["value1", "value2", "value3"]

# Dataset Groups
dataset_groups:
  - name: "tpch-multi-scale"
    description: "TPC-H datasets at multiple scale factors"
    datasets:
      - "tpch-tiny"
      - "tpch-sf1" 
      - "tpch-sf10"
      
  - name: "iceberg-features"
    description: "Datasets showcasing Iceberg features"
    datasets:
      - "tpch-sf1-iceberg"
      
  - name: "development"
    description: "Small datasets for development"
    datasets:
      - "tpch-tiny"
