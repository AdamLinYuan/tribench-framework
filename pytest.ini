[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Add verbose output
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=tribench
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
    requires_trino: Tests that require a running Trino instance
    requires_docker: Tests that require Docker

# Coverage settings
[coverage:run]
source = lib/tribench
omit = 
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
