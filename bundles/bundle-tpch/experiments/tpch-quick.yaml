name: "bundle-tpch-quick"
description: "TPC-H 3-query run from bundle-tpch"
system: "trino"

connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

runs: 1
warmup_runs: 0
timeout_seconds: 120
max_retries: 1

monitoring:
  enabled: false

query_files:
  - "queries/tpch/queries/q01.sql"
  - "queries/tpch/queries/q06.sql"
  - "queries/tpch/queries/q14.sql"

metadata:
  benchmark: "TPC-H"
  bundle: "bundle-tpch"
