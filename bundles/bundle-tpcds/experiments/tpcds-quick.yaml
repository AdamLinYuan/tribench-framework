name: "bundle-tpcds-quick"
description: "TPC-DS 3-query run from bundle-tpcds"
system: "trino"

connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpcds"

runs: 1
warmup_runs: 0
timeout_seconds: 300
max_retries: 1

monitoring:
  enabled: false

query_files:
  - "queries/tpcds/queries/q01.sql"
  - "queries/tpcds/queries/q02.sql"
  - "queries/tpcds/queries/q03.sql"

metadata:
  benchmark: "TPC-DS"
  bundle: "bundle-tpcds"
