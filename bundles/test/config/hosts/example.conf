# ==============================================================================
# TriBench Host Configuration — Compact Template
# ==============================================================================
# Copy to config/hosts/<profile-name>.conf and uncomment what you need.
# Activate with: tribench config profile set <profile-name>
# Full reference: config/templates/host-template.conf
# ==============================================================================

tribench {

  defaults {
    # "docker" (default) or "kubernetes"
    backend = "docker"
  }

  systems {

    trino {
      coordinator {
        # host = "localhost"
        # port = 8080
        # user  = "admin"

        # jvm {
        #   heap = "4G"
        # }
      }

      # Worker count for Kubernetes (leave empty = auto-detect from nodes)
      # workers = 3
    }

    minio {
      # access_key = "minioadmin"
      # secret_key = "minioadmin"
    }

    postgresql {
      # host = "localhost"
      # port = 5432
    }

    hive_metastore {
      # host = "localhost"
      # port = 9083

      # Kubernetes image (uncomment for the target environment)
      # kubernetes {
      #   # Kind (local):
      #   image = "tribench-hive-metastore:"${tribench.systems.hive_metastore.version}
      #   imagePullPolicy = "Never"
      #
      #   # GKE (cloud):
      #   # image = "us-central1-docker.pkg.dev/<project>/tribench/hive-metastore:"${tribench.systems.hive_metastore.version}
      #   # imagePullPolicy = "IfNotPresent"
      # }
    }
  }

  # ---------------------------------------------------------------------------
  # Kubernetes  (only needed when backend = "kubernetes")
  # ---------------------------------------------------------------------------
  # kubernetes {
  #   context   = "kind-tribench"       # or "gke_<project>_<zone>_<cluster>"
  #   namespace = "tribench"
  # }
}

