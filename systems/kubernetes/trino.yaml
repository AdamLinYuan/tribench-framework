apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
data: 
  config.properties: |
    # Trino Configuration Properties
    # Generated by TriBench from HOCON configuration
    
    # Coordinator or worker
    coordinator=true
    
    # HTTP server configuration
    http-server.http.port=8080
    
    # Discovery server
    discovery.uri=http://localhost:8080
    
    # Query configuration
    query.max-memory=4GB
    query.max-memory-per-node=1GB
    
    node-scheduler.include-coordinator=false
  jvm.config: |
    # Trino JVM Configuration
    # Generated by TriBench from HOCON configuration
    
    -server
    -Xmx2G
    -XX:InitialRAMPercentage=80
    -XX:MaxRAMPercentage=80
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=512M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
  node.properties: |
    # Node Properties
    node.environment=tribench
    node.id=b337b714-3583-4cc1-bdce-8d0662c631f6
    node.data-dir=/data/trino

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
data: 
  tpch.properties: |
    connector.name=tpch

  iceberg.properties: |
    # Iceberg Catalog Configuration
    # Connector type
    connector.name=iceberg
    
    # Catalog type - use Hive Metastore
    iceberg.catalog.type=hive_metastore
    hive.metastore.uri=thrift://tribench-hive-metastore:9083
    
    # S3-compatible storage (MinIO) - using Trino native S3
    fs.native-s3.enabled=true
    s3.endpoint=http://tribench-minio:9000
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
    s3.path-style-access=true
    s3.region=us-east-1
    
    # Iceberg format settings
    iceberg.file-format=PARQUET
    iceberg.compression-codec=SNAPPY
    
    # Performance tuning
    iceberg.max-partitions-per-writer=1000
    iceberg.target-max-file-size=1GB

  memory.properties: |
    connector.name=memory
    memory.max-data-per-node=128MB

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      component: coordinator
  template:
    metadata:
      labels:
        app: trino
        component: coordinator
    spec:
      containers:
      - name: trino
        image: trinodb/trino:434
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /etc/trino
        - name: catalog-volume
          mountPath: /etc/trino/catalog
        livenessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: trino-config
      - name: catalog-volume
        configMap:
          name: trino-catalog
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-worker-config
data: 
  config.properties: |
    # Trino Configuration Properties
    # Generated by TriBench from HOCON configuration
    
    # Coordinator or worker
    coordinator=false
    
    # HTTP server configuration
    http-server.http.port=8080
    
    # Discovery server
    discovery.uri=http://tribench-trino:8080
    
    # Query configuration
    query.max-memory=4GB
    query.max-memory-per-node=1GB
  jvm.config: |
    # Trino JVM Configuration
    # Generated by TriBench from HOCON configuration
    
    -server
    -Xmx2G
    -XX:InitialRAMPercentage=80
    -XX:MaxRAMPercentage=80
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=512M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
  node.properties: |
    # Node Properties
    node.environment=tribench
    node.data-dir=/data/trino

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trino
      component: worker
  template:
    metadata:
      labels:
        app: trino
        component: worker
    spec:
      containers:
      - name: trino-worker
        image: trinodb/trino:434
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /etc/trino
        - name: catalog-volume
          mountPath: /etc/trino/catalog
        livenessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: trino-worker-config
      - name: catalog-volume
        configMap:
          name: trino-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: tribench-trino
spec:
  selector:
    app: trino
    component: coordinator
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
