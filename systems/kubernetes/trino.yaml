apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
data: 
  config.properties: |
    # Trino Configuration Properties
    # Generated by TriBench from HOCON configuration
    
    # Coordinator or worker
    coordinator=true
    
    # HTTP server configuration
    http-server.http.port=8080
    
    # Discovery server
    discovery.uri=http://localhost:8080
    
    # Query configuration
    query.max-memory=20GB
    query.max-memory-per-node=5GB
    
    node-scheduler.include-coordinator=false
  jvm.config: |
    # Trino JVM Configuration
    # Generated by TriBench from HOCON configuration
    
    -Xmx8G
    -server
    -XX:InitialRAMPercentage=80
    -XX:MaxRAMPercentage=80
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=512M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
    
  node.properties: |
    # Node Properties
    node.environment=production
    node.id=69d4836c-216d-4bd7-94dd-2ad7b4143132
    node.data-dir=/data

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
data: 
  tpch.properties: |
    connector.name=tpch

  hive.properties: |
    # Hive Catalog Configuration
    # Used for creating external tables to stage Parquet data before loading into Iceberg
    connector.name=hive
    
    # Hive Metastore connection
    hive.metastore.uri=thrift://tribench-hive-metastore:9083
    
    # S3-compatible storage (MinIO)
    hive.s3.endpoint=http://tribench-minio:9000
    hive.s3.aws-access-key=minioadmin
    hive.s3.aws-secret-key=minioadmin
    hive.s3.path-style-access=true
    hive.s3.region=us-east-1
    
    # Allow creating external tables
    hive.non-managed-table-writes-enabled=true
    hive.non-managed-table-creates-enabled=true
    
    # Parquet format support
    hive.parquet.use-column-names=true

  iceberg.properties: |
    # Iceberg Catalog Configuration
    # Connector type
    connector.name=iceberg
    
    # Catalog type - use Hive Metastore
    iceberg.catalog.type=hive_metastore
    hive.metastore.uri=thrift://tribench-hive-metastore:9083
    
    # S3-compatible storage (MinIO) - using Trino native S3
    fs.native-s3.enabled=true
    s3.endpoint=http://tribench-minio:9000
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
    s3.path-style-access=true
    s3.region=us-east-1
    
    # Iceberg format settings
    iceberg.file-format=PARQUET
    iceberg.compression-codec=SNAPPY
    
    # Table location
    iceberg.unique-table-location=true
    
    # Performance tuning
    iceberg.max-partitions-per-writer=1000
    iceberg.target-max-file-size=1GB

  memory.properties: |
    connector.name=memory
    memory.max-data-per-node=128MB

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      component: coordinator
  template:
    metadata:
      labels:
        app: trino
        component: coordinator
    spec:
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
      - name: trino
        image: trinodb/trino:434
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /etc/trino
        - name: catalog-volume
          mountPath: /etc/trino/catalog
        - name: data-volume
          mountPath: /var/trino
        livenessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: trino-config
      - name: catalog-volume
        configMap:
          name: trino-catalog
      - name: data-volume
        emptyDir: {}
---
apiVersion: v1
