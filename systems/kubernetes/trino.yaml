---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trino
      component: worker
  template:
    metadata:
      labels:
        app: trino
        component: worker
    spec:
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
      - name: trino-worker
        image: trinodb/trino:434
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /etc/trino
        - name: catalog-volume
          mountPath: /etc/trino/catalog
        - name: data-volume
          mountPath: /var/trino
        livenessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: trino-worker-config
      - name: catalog-volume
        configMap:
          name: trino-catalog
      - name: data-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tribench-trino
spec:
  selector:
    app: trino
    component: coordinator
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
