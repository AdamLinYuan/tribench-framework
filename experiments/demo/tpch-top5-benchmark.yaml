# ============================================================================
# TPC-H Top 5 Representative Queries Benchmark
# ============================================================================
# The most commonly used TPC-H queries for benchmarking:
# Q1, Q3, Q5, Q6, Q14 - covers aggregation, joins, and filtering

name: "tpch-top5-benchmark"
description: "TPC-H top 5 representative queries - comprehensive benchmark coverage"

system: "trino"

connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

# Standard benchmark settings
runs: 5
warmup_runs: 2
timeout_seconds: 180
max_retries: 2

# Top 5 representative TPC-H queries
query_files:
  - "apps/tpch/queries/q01.sql"  # Q1: Pricing Summary (aggregation)
  - "apps/tpch/queries/q03.sql"  # Q3: Shipping Priority (3-way join)
  - "apps/tpch/queries/q05.sql"  # Q5: Local Supplier Volume (6-way join)
  - "apps/tpch/queries/q06.sql"  # Q6: Revenue Change (scan + filter)
  - "apps/tpch/queries/q14.sql"  # Q14: Promotion Effect (join + conditional)

validation:
  min_success_rate: 0.95
  max_execution_time_variance: 0.30

metrics:
  - execution_time
  - rows_returned
  - cpu_time
  - memory_usage
  - data_scanned

monitoring:
  enabled: true
  interval_seconds: 5
  metrics:
    - cpu_usage
    - memory_usage

metadata:
  benchmark: "TPC-H"
  scale_factor: 0.01
  dataset: "tpch-tiny"
  query_type: "mixed"
  tags: ["demo", "tpch", "iceberg", "benchmark", "top5", "representative"]
  purpose: "Comprehensive benchmark with representative queries"
