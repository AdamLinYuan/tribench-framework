# ============================================================================
# TPC-H Quick Smoke Test
# ============================================================================
# Fast validation that the system is working - runs simplest queries once

name: "tpch-quick-smoke"
description: "Quick smoke test - validates system connectivity and basic query execution"

system: "trino"

connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

# Minimal execution for speed
runs: 1
warmup_runs: 0
timeout_seconds: 60
max_retries: 1

# Simple inline queries for quick validation
queries:
  - |
    -- Smoke test: Basic table scan
    SELECT COUNT(*) as row_count FROM nation
  - |
    -- Smoke test: Simple aggregation
    SELECT r_name, COUNT(*) as nation_count 
    FROM region r JOIN nation n ON r.r_regionkey = n.n_regionkey
    GROUP BY r_name
    ORDER BY r_name
  - |
    -- Smoke test: Date filter (common pattern)
    SELECT COUNT(*) as order_count
    FROM orders
    WHERE o_orderdate >= DATE '1995-01-01'

# Relaxed validation for smoke test
validation:
  min_success_rate: 0.80
  max_execution_time_variance: 1.0

metrics:
  - execution_time
  - rows_returned

# Disable monitoring for speed
monitoring:
  enabled: false

metadata:
  benchmark: "smoke-test"
  scale_factor: 0.01
  dataset: "tpch-tiny"
  query_type: "smoke"
  tags: ["demo", "smoke-test", "quick", "validation"]
  purpose: "Quick system validation"
