# ============================================================================
# TPC-H Join Queries Demo
# ============================================================================
# Focuses on queries that demonstrate join performance across multiple tables
# Queries: Q3 (Shipping Priority), Q5 (Local Supplier Volume), Q10 (Returned Item)

name: "tpch-join-demo"
description: "TPC-H join-focused queries demonstrating multi-table join performance"

system: "trino"

connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

# Execution parameters
runs: 3
warmup_runs: 1
timeout_seconds: 180
max_retries: 2

# Join-focused queries
query_files:
  - "apps/tpch/queries/q03.sql"  # Shipping Priority - 3-way join
  - "apps/tpch/queries/q05.sql"  # Local Supplier Volume - 6-way join
  - "apps/tpch/queries/q10.sql"  # Returned Item Reporting - 4-way join

validation:
  min_success_rate: 0.90
  max_execution_time_variance: 0.40

metrics:
  - execution_time
  - rows_returned
  - cpu_time
  - memory_usage
  - data_scanned

metadata:
  benchmark: "TPC-H"
  scale_factor: 0.01
  dataset: "tpch-tiny"
  query_type: "join"
  tags: ["demo", "tpch", "iceberg", "join", "multi-table"]
  purpose: "Demo join query performance"
