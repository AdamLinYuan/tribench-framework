# ============================================================================
# Complete Experiment Configuration Reference for TriBench Framework
# ============================================================================
#
# This template shows ALL available configuration options for experiments.
# Use this as a reference when creating your own experiments.
# Most options are optional - remove what you don't need!
#
# ============================================================================

# ----------------------------------------------------------------------------
# REQUIRED FIELDS
# ----------------------------------------------------------------------------

name: "complete-reference-experiment"
description: "Complete reference showing all possible experiment configuration options"
system: "trino"  # System to run queries against (currently only "trino" supported)

# ----------------------------------------------------------------------------
# DATASET SPECIFICATION
# ----------------------------------------------------------------------------

# Option 1: Top-level dataset field (recommended)
dataset: "tpch-sf1"  # Dataset identifier for result tracking and organization

# Option 2: Specify in metadata (used if top-level dataset not set)
# See metadata section below

# ----------------------------------------------------------------------------
# CONNECTION CONFIGURATION
# ----------------------------------------------------------------------------

connection:
  # Required connection parameters
  host: "localhost"              # Trino coordinator host
  port: 8080                     # Trino HTTP port
  user: "tribench"               # Username for authentication
  
  # Catalog and schema
  catalog: "tpch"                # Trino catalog (e.g., memory, hive, iceberg)
  schema: "sf1"                  # Schema/database within catalog
  
  # Optional authentication
  # password: "secret"           # Password (use secrets management!)
  
  # Optional SSL/TLS configuration
  # ssl: true                    # Enable SSL/TLS
  # ssl_verify: true             # Verify SSL certificate
  # ssl_cert: "/path/to/cert"    # Path to SSL certificate
  # ssl_key: "/path/to/key"      # Path to SSL key
  
  # Optional session properties
  # session_properties:
  #   query_max_memory: "10GB"
  #   query_max_run_time: "10m"
  #   distributed_join: "true"
  
  # Optional HTTP headers
  # http_headers:
  #   X-Trino-Client-Tags: "benchmark,tpch"
  #   X-Custom-Header: "value"
  
  # Optional extra credentials
  # extra_credentials:
  #   key1: value1
  #   key2: value2

# ----------------------------------------------------------------------------
# EXECUTION PARAMETERS
# ----------------------------------------------------------------------------

runs: 3                          # Number of measured runs (default: 1)
                                 # Recommendation: 
                                 #   - Development: 1-2
                                 #   - Testing: 3-5
                                 #   - Production: 10+
                                 #   - Regression tests: 20+

warmup_runs: 1                   # Warmup runs before measurement (default: 0)
                                 # Recommendation:
                                 #   - Quick tests: 0
                                 #   - Cache-sensitive: 1-2
                                 #   - JVM warmup: 3-5

timeout_seconds: 300             # Query timeout in seconds (default: 300)
                                 # Recommendation:
                                 #   - Simple queries: 60-300
                                 #   - Complex queries: 600-1800
                                 #   - Long analytics: 3600+

max_retries: 3                   # Max retry attempts on failure (default: 3)
                                 # Set to 0 to fail immediately

# ----------------------------------------------------------------------------
# QUERY SPECIFICATION - Choose at least one method
# ----------------------------------------------------------------------------

# Method 1: Inline SQL queries
queries:
  - |
    -- Simple aggregation query
    SELECT 
        COUNT(*) as total_rows,
        SUM(quantity) as total_quantity,
        AVG(price) as avg_price
    FROM 
        orders
    WHERE 
        order_date >= DATE '2024-01-01'
  
  - |
    -- Complex analytical query with joins
    SELECT 
        c.customer_name,
        c.region,
        COUNT(o.order_id) as order_count,
        SUM(o.total_amount) as total_spent,
        AVG(o.total_amount) as avg_order_value
    FROM 
        customers c
        JOIN orders o ON c.customer_id = o.customer_id
    WHERE 
        o.order_date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
    GROUP BY 
        c.customer_name, c.region
    HAVING 
        COUNT(o.order_id) >= 5
    ORDER BY 
        total_spent DESC
    LIMIT 100
  
  - |
    -- Window function query
    SELECT 
        product_id,
        sale_date,
        revenue,
        SUM(revenue) OVER (
            PARTITION BY product_id 
            ORDER BY sale_date 
            ROWS BETWEEN 6 PRECEDING AND CURRENT ROW
        ) as moving_avg_7day
    FROM 
        product_sales
    WHERE 
        sale_date >= DATE '2024-01-01'

# Method 2: Load queries from SQL files
query_files:
  - "apps/tpch/queries/q01.sql"           # Relative to project root
  - "apps/tpch/queries/q02.sql"
  - "queries/custom/analysis.sql"
  # - "/absolute/path/to/query.sql"       # Absolute paths also work

# Method 3: Use query templates (if implemented)
# query_templates:
#   - template: "tpch_q1"
#     parameters:
#       delta_days: 90
#   - template: "aggregation"
#     parameters:
#       table: "lineitem"
#       group_by: "returnflag"

# Note: You can combine methods - all queries will be executed in order

# ----------------------------------------------------------------------------
# VALIDATION RULES
# ----------------------------------------------------------------------------

validation:
  # Success rate validation
  min_success_rate: 0.95         # Minimum fraction of successful runs (0.0-1.0)
                                 # Example: 0.95 = 95% of runs must succeed
                                 # Recommendation:
                                 #   - Development: 0.80-0.90
                                 #   - Testing: 0.90-0.95
                                 #   - Production: 0.95-0.98
                                 #   - Critical: 0.99-1.00
  
  # Performance variance validation
  max_execution_time_variance: 0.3  # Maximum coefficient of variation (CV)
                                    # CV = standard_deviation / mean
                                    # Example: 0.3 = 30% variation allowed
                                    # Recommendation:
                                    #   - Reproducible: 0.10-0.15
                                    #   - Normal: 0.15-0.25
                                    #   - Relaxed: 0.25-0.50
                                    #   - Development: 0.50+
  
  # Result correctness validation (optional)
  # check_result_correctness: true      # Verify query results are correct
  # expected_row_count: 100             # Expected number of rows
  # expected_checksum: "abc123def456"   # Expected result checksum (MD5)
  # result_validation_query: "SELECT COUNT(*) FROM expected_results"
  
  # Performance regression validation (optional)
  # baseline_experiment_id: 42          # Compare against baseline experiment
  # max_regression_percentage: 10       # Maximum % slower than baseline
  # min_improvement_percentage: 5       # Minimum % faster to be considered improvement

# ----------------------------------------------------------------------------
# METRICS COLLECTION
# ----------------------------------------------------------------------------

metrics:
  # Time metrics
  - execution_time                # Total query execution time (always collected)
  - planning_time                 # Query planning/compilation time
  - analysis_time                 # Query analysis time
  - scheduling_time               # Query scheduling time
  - blocked_time                  # Time blocked on resources
  
  # Row metrics
  - rows_returned                 # Number of rows returned
  - input_rows                    # Number of input rows processed
  - output_rows                   # Number of output rows
  
  # CPU metrics
  - cpu_time                      # Total CPU time used
  - scheduled_time                # Time scheduled on CPU
  
  # Memory metrics
  - memory_usage                  # Peak memory usage
  - peak_memory_bytes             # Peak memory in bytes
  - cumulative_memory             # Cumulative memory usage
  
  # Data metrics
  - data_scanned                  # Amount of data scanned
  - input_bytes                   # Input data size
  - output_bytes                  # Output data size
  - physical_input_bytes          # Physical input data size
  - physical_input_rows           # Physical input row count
  
  # Operator metrics
  - operator_summaries            # Per-operator statistics
  
  # Custom metrics (if implemented)
  # - custom_metric_1
  # - custom_metric_2

# Note: Not all metrics may be available for all queries/systems
# Metrics are automatically collected when available from the query engine

# ----------------------------------------------------------------------------
# MONITORING CONFIGURATION
# ----------------------------------------------------------------------------

monitoring:
  enabled: true                  # Enable resource monitoring (default: true)
  interval_seconds: 5            # Monitoring sample interval (default: 5)
                                 # Recommendation:
                                 #   - Quick tests: 10-30 seconds
                                 #   - Normal: 5-10 seconds
                                 #   - Detailed profiling: 1-2 seconds
  
  # Metrics to monitor
  metrics:
    - cpu_usage                  # CPU utilization percentage (0-100%)
    - memory_usage               # Memory usage in bytes
    - disk_io                    # Disk I/O operations per second
    - network_io                 # Network I/O bytes per second
    # - query_queue_depth        # Number of queued queries
    # - active_queries           # Number of active queries
    # - gc_time                  # Garbage collection time (JVM)
    # - thread_count             # Number of active threads
    # - open_file_descriptors    # Number of open files
  
  # Process to monitor (optional)
  # process_name: "java"         # Monitor specific process
  # process_pid: 12345           # Monitor specific PID
  
  # Alert thresholds (optional)
  # alerts:
  #   cpu_threshold: 90          # Alert if CPU > 90%
  #   memory_threshold: 0.85     # Alert if memory > 85%
  #   disk_io_threshold: 1000    # Alert if disk I/O > 1000 ops/s

# ----------------------------------------------------------------------------
# RESULT STORAGE CONFIGURATION
# ----------------------------------------------------------------------------

# Database storage
enable_database: true            # Store results in database (default: true)
                                 # Set to false to disable database storage

# File storage (optional)
# save_results_to_file: true     # Save results as JSON/Parquet files
# result_format: "json"          # Format: json, parquet, csv
# result_directory: "results/"   # Directory for result files

# Query result storage (optional)
# save_query_results: false      # Save actual query result rows (default: false)
#                                # WARNING: Can use significant storage!
# max_result_rows: 1000          # Maximum rows to save per query

# ----------------------------------------------------------------------------
# CACHING CONFIGURATION
# ----------------------------------------------------------------------------

# Result caching
# result_caching: false          # Disable result caching (default: false)
                                 # Set to true to enable result caching in Trino

# Cache warming
# cache_warming: false           # Enable cache warming (default: false)
                                 # Runs queries once before measurement to warm caches

# Cache clearing
# clear_cache_before_run: false  # Clear caches before each run
                                 # Ensures cold-cache measurements

# ----------------------------------------------------------------------------
# PARALLELISM CONFIGURATION
# ----------------------------------------------------------------------------

# Query parallelism
# parallel_queries: 1            # Number of queries to run in parallel (default: 1)
                                 # WARNING: Can affect measurement accuracy!
                                 # Use only for throughput testing

# Query execution order
# query_order: "sequential"      # Order to execute queries (default: sequential)
                                 # Options: sequential, random, optimized
                                 # - sequential: Execute in order listed
                                 # - random: Randomize execution order
                                 # - optimized: Order by estimated complexity

# ----------------------------------------------------------------------------
# ADVANCED OPTIONS
# ----------------------------------------------------------------------------

# Adaptive timeout (optional)
# adaptive_timeout: true         # Adjust timeout based on query complexity
# timeout_multiplier: 1.5        # Multiplier for adaptive timeout

# Failure handling
# fail_fast: false               # Stop on first query failure (default: false)
# continue_on_error: true        # Continue to next query on error (default: true)

# Output control
# verbose: false                 # Verbose output during execution
# quiet: false                   # Suppress non-essential output

# Debugging
# debug: false                   # Enable debug logging
# explain_only: false            # Only run EXPLAIN, don't execute queries
# dry_run: false                 # Validate configuration without execution

# Resource limits (optional)
# resource_limits:
#   max_memory_gb: 10            # Maximum memory for query execution
#   max_cpu_cores: 4             # Maximum CPU cores to use
#   max_disk_gb: 100             # Maximum disk usage

# ----------------------------------------------------------------------------
# METADATA / TAGGING
# ----------------------------------------------------------------------------

metadata:
  # Dataset information (used if top-level dataset not specified)
  dataset: "tpch-sf1-iceberg"    # Dataset identifier
  dataset_location: "s3://bucket/path"  # Physical location
  dataset_format: "iceberg"      # Format: parquet, orc, iceberg, delta, hudi
  
  # Benchmark information
  benchmark: "TPC-H"             # Benchmark name
  benchmark_version: "3.0"       # Benchmark version
  scale_factor: 1                # Data scale factor (GB, rows, etc.)
  scale_factor_unit: "GB"        # Unit for scale factor
  
  # Query information
  query_number: 1                # Query number within benchmark
  query_name: "Pricing Summary" # Descriptive query name
  query_type: "aggregation"     # Type: aggregation, join, scan, etc.
  query_complexity: "medium"    # Complexity: simple, medium, complex
  
  # Expected results (for validation)
  expected_rows: 4               # Expected number of result rows
  expected_checksum: "abc123"   # Expected result checksum
  expected_execution_time: 5.0  # Expected execution time (seconds)
  
  # Categorization
  tags: ["benchmark", "tpch", "aggregation", "production"]
  category: "olap"               # Category: olap, oltp, etl, ml, etc.
  purpose: "baseline"            # Purpose: baseline, regression, optimization
  priority: "high"               # Priority: low, medium, high, critical
  
  # Environment information
  environment: "production"      # Environment: dev, test, staging, prod
  cluster: "prod-cluster-01"    # Cluster identifier
  region: "us-east-1"           # Cloud region
  
  # Data characteristics
  compression: "snappy"          # Compression codec
  partitioning: "by_date"       # Partitioning scheme
  file_format: "parquet"        # File format
  statistics: "full"            # Statistics level: none, basic, full
  
  # Software versions
  trino_version: "434"          # Trino version
  connector_version: "1.0"      # Connector version
  client_version: "1.0"         # Client version
  
  # Tracking information
  author: "Your Name"           # Experiment author
  team: "Data Engineering"      # Team responsible
  jira_ticket: "PROJ-123"       # Issue tracker reference
  git_commit: "abc123def"       # Git commit hash
  git_branch: "main"            # Git branch
  
  # Documentation
  notes: "Testing new optimization feature"  # Free-form notes
  documentation_url: "https://wiki.example.com/experiment-123"
  
  # Feature flags (optional)
  features:
    new_optimizer: true         # Feature under test
    experimental_mode: false
  
  # Cost tracking (optional)
  cost:
    budget: 100.0               # Budget allocation
    currency: "USD"             # Currency
    cost_center: "eng-data"     # Cost center
  
  # SLA/Performance targets (optional)
  sla:
    max_execution_time: 10.0    # Maximum acceptable time (seconds)
    max_memory_usage: 5.0       # Maximum acceptable memory (GB)
    min_throughput: 1000        # Minimum throughput (rows/sec)
  
  # Custom metadata (add any additional fields)
  custom_field_1: "value1"
  custom_field_2: "value2"

# ============================================================================
# CONFIGURATION HIERARCHY
# ============================================================================
#
# When used in a suite, settings are merged in this order (later overrides earlier):
#
# 1. Suite defaults
# 2. This experiment file
# 3. Suite per-experiment overrides
# 4. CLI flags
#
# Example with suite:
#   Suite default:       runs: 3
#   Experiment file:     runs: 5          ← This file
#   Suite override:      runs: 10
#   CLI flag:            --runs 20
#   → Result: 20 runs (CLI wins)
#
# Example standalone:
#   Experiment file:     runs: 5          ← This file
#   CLI flag:            --runs 10
#   → Result: 10 runs (CLI wins)

# ============================================================================
# USAGE EXAMPLES
# ============================================================================
#
# Run experiment:
#   tribench exp run experiments/my-experiment.yaml
#
# Run with overrides:
#   tribench exp run my-experiment.yaml --runs 10 --timeout 600
#
# Dry run (validate without executing):
#   tribench exp run my-experiment.yaml --dry-run
#
# Run with verbose output:
#   tribench exp run my-experiment.yaml --verbose
#
# Disable monitoring:
#   tribench exp run my-experiment.yaml --no-monitoring
#
# Save results to JSON:
#   tribench exp run my-experiment.yaml --save-json
#
# Disable database storage:
#   tribench exp run my-experiment.yaml --no-storage
#
# Run only specific queries:
#   tribench exp run my-experiment.yaml --query-index 0,2,4
#
# Run with different connection:
#   tribench exp run my-experiment.yaml --host remote-server --port 8443

# ============================================================================
# RESULT MANAGEMENT
# ============================================================================
#
# List all experiments:
#   tribench res list
#
# Show experiment details:
#   tribench res show <experiment-name-or-id>
#
# Show experiment runs:
#   tribench res show <id> --runs
#
# Show specific run details:
#   tribench res show <id> --run <run-number>
#
# View query executions:
#   tribench res show <id> --queries
#
# View monitoring metrics:
#   tribench res monitoring <run-id> --summary
#   tribench res monitoring <run-id> --detailed
#
# Export results:
#   tribench res export <id> --format json --output results.json
#   tribench res export <id> --format csv --output results.csv
#   tribench res export <id> --format parquet --output results.parquet
#
# Compare experiments:
#   tribench res compare <id1> <id2> <id3>
#
# Delete experiment:
#   tribench res delete <id>

# ============================================================================
# TIPS & BEST PRACTICES
# ============================================================================
#
# 1. Experiment Naming:
#    - Use descriptive, unique names
#    - Include key parameters: "tpch-q1-sf10-iceberg"
#    - Use consistent naming conventions
#    - Avoid special characters except hyphens and underscores
#
# 2. Query Design:
#    - Test queries individually before benchmarking
#    - Use EXPLAIN to understand query plans
#    - Start with simple queries, add complexity gradually
#    - Document query purpose in comments
#
# 3. Execution Configuration:
#    - Development/Testing: 1-2 runs, no warmup
#    - Basic benchmarking: 3-5 runs, 1 warmup
#    - Production benchmarking: 10+ runs, 2-3 warmup
#    - Regression testing: 20+ runs, 3-5 warmup
#    - Set timeout to 2-3x expected execution time
#
# 4. Warmup Runs:
#    - Use for cache-sensitive workloads
#    - Use for JVM warmup (JIT compilation)
#    - Skip for cold-cache measurements
#    - Skip for quick smoke tests
#
# 5. Validation:
#    - Start with relaxed thresholds (0.80, 0.50)
#    - Tighten based on observed results
#    - Production: min_success_rate ≥ 0.95
#    - Reproducible: max_execution_time_variance ≤ 0.15
#
# 6. Monitoring:
#    - Enable for performance analysis
#    - Disable for quick tests to reduce overhead
#    - Use shorter intervals (1-2s) for detailed profiling
#    - Use longer intervals (10-30s) for long-running tests
#
# 7. Metadata:
#    - Document dataset characteristics
#    - Tag experiments for easy filtering
#    - Include version information (software, data, config)
#    - Document expected results for validation
#    - Add notes about special conditions
#
# 8. Result Storage:
#    - Always enable database storage for persistence
#    - Use file storage for large result sets
#    - Be careful with save_query_results (can be huge!)
#    - Export important results to external systems
#
# 9. Resource Management:
#    - Set appropriate timeouts to prevent runaway queries
#    - Monitor resource usage during execution
#    - Use resource limits for multi-tenant environments
#    - Clean up old results periodically
#
# 10. Organization:
#     - Group related experiments in directories
#     - experiments/tpch/ for TPC-H queries
#     - experiments/custom/ for custom workloads
#     - Keep query files in experiments/queries/
#     - Use suites for related experiments
#
# 11. Version Control:
#     - Commit experiment configs to git
#     - Track changes to queries
#     - Document why changes were made
#     - Use branches for experimental features
#
# 12. Testing Strategy:
#     - Start with dry-run to validate config
#     - Run single iteration first
#     - Verify results before full benchmark
#     - Use smoke tests before long-running tests

# ============================================================================
# COMMON PATTERNS
# ============================================================================
#
# Pattern 1: Quick Smoke Test
# name: "smoke-test"
# runs: 1
# warmup_runs: 0
# timeout_seconds: 60
# monitoring: { enabled: false }
# validation: { min_success_rate: 0.50 }
#
# Pattern 2: Development Testing
# name: "dev-test"
# runs: 2
# warmup_runs: 1
# timeout_seconds: 300
# validation: { min_success_rate: 0.90, max_execution_time_variance: 0.50 }
#
# Pattern 3: Production Benchmark
# name: "prod-benchmark"
# runs: 10
# warmup_runs: 3
# timeout_seconds: 1800
# monitoring: { enabled: true, interval_seconds: 5 }
# validation: { min_success_rate: 0.98, max_execution_time_variance: 0.15 }
#
# Pattern 4: Regression Test
# name: "regression-test"
# runs: 20
# warmup_runs: 5
# validation: 
#   min_success_rate: 0.98
#   max_execution_time_variance: 0.15
#   baseline_experiment_id: 42
#   max_regression_percentage: 5
#
# Pattern 5: Cold Cache Test
# name: "cold-cache-test"
# runs: 5
# warmup_runs: 0
# clear_cache_before_run: true
# result_caching: false
#
# Pattern 6: Throughput Test
# name: "throughput-test"
# parallel_queries: 10
# runs: 5
# monitoring: { enabled: true, interval_seconds: 1 }
# metrics: [execution_time, throughput, concurrency]

# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# Problem: Queries timing out
# Solution: Increase timeout_seconds, check query complexity, verify resources
#
# Problem: High variance in execution times
# Solution: Increase warmup_runs, check for resource contention, use cache_warming
#
# Problem: Low success rate
# Solution: Check query syntax, verify connection, review Trino logs, increase timeout
#
# Problem: Monitoring overhead affecting results
# Solution: Increase monitoring interval_seconds, disable monitoring, use separate process
#
# Problem: Results not stored in database
# Solution: Check enable_database: true, verify database connection, check permissions
#
# Problem: Out of memory errors
# Solution: Reduce parallel_queries, increase timeout, check resource_limits
#
# Problem: Can't reproduce results
# Solution: Increase runs, add warmup_runs, control for external factors
#
# Problem: Validation failing
# Solution: Check validation thresholds, review actual results, check for query issues

