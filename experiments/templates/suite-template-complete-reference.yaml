# Complete Suite Configuration Reference
#
# This template shows ALL available configuration options for experiment suites.
# Use this as a reference when creating your own suites.
# Most options are optional - remove what you don't need!

name: complete-reference-suite
description: Complete reference showing all possible suite configuration options

# ============================================================================
# SUITE-LEVEL DEFAULTS
# ============================================================================
# All settings here are applied to every experiment unless overridden
defaults:
  
  # --------------------------------------------------------------------------
  # System Configuration
  # --------------------------------------------------------------------------
  system: trino                    # System to run experiments on (trino, spark, etc.)
  
  # --------------------------------------------------------------------------
  # Execution Parameters
  # --------------------------------------------------------------------------
  runs: 3                          # Number of times to execute each query
  warmup_runs: 1                   # Number of warmup executions (not measured)
  timeout_seconds: 300             # Maximum execution time per query (seconds)
  max_retries: 2                   # Number of retry attempts on failure
  
  # --------------------------------------------------------------------------
  # Connection Configuration
  # --------------------------------------------------------------------------
  connection:
    host: localhost                # Database host
    port: 8080                     # Database port
    user: tribench                 # Username
    catalog: tpch                  # Catalog name
    schema: tiny                   # Schema/database name
    # password: secret             # Optional: password (use secrets management!)
    # ssl: true                    # Optional: enable SSL/TLS
    # ssl_verify: true             # Optional: verify SSL certificate
    # extra_credentials:           # Optional: additional connection parameters
    #   key: value
  
  # --------------------------------------------------------------------------
  # Query Configuration
  # --------------------------------------------------------------------------
  # queries:                       # Optional: inline SQL queries
  #   - "SELECT * FROM table1"
  #   - "SELECT COUNT(*) FROM table2"
  
  # query_files:                   # Optional: paths to SQL files
  #   - "queries/query1.sql"
  #   - "queries/query2.sql"
  
  # --------------------------------------------------------------------------
  # Validation Rules
  # --------------------------------------------------------------------------
  validation:
    min_success_rate: 0.95         # Minimum fraction of queries that must succeed (0.0-1.0)
    max_execution_time_variance: 0.2  # Maximum coefficient of variation (CV) in execution times
    # check_result_correctness: true    # Optional: validate result correctness
    # expected_row_count: 100           # Optional: expected number of rows
    # expected_checksum: "abc123"       # Optional: expected result checksum
  
  # --------------------------------------------------------------------------
  # Monitoring Configuration
  # --------------------------------------------------------------------------
  monitoring:
    enabled: true                  # Enable resource monitoring
    interval_seconds: 5            # Monitoring sample interval
    metrics:                       # List of metrics to collect
      - cpu_usage                  # CPU utilization percentage
      - memory_usage               # Memory usage (bytes)
      - disk_io                    # Disk I/O operations
      - network_io                 # Network I/O bytes
      # - query_queue_depth        # Optional: query queue size
      # - active_queries           # Optional: number of active queries
      # - gc_time                  # Optional: garbage collection time
  
  # --------------------------------------------------------------------------
  # Result Storage Configuration
  # --------------------------------------------------------------------------
  # enable_database: true          # Optional: store results in database (default: true)
  # result_format: json            # Optional: result format (json, parquet, csv)
  # save_query_results: false      # Optional: save actual query result rows
  
  # --------------------------------------------------------------------------
  # Metrics Collection
  # --------------------------------------------------------------------------
  metrics:                         # List of metrics to collect
    - execution_time               # Total execution time
    - rows_returned                # Number of rows returned
    - cpu_time                     # CPU time used
    - memory_usage                 # Peak memory usage
    - data_scanned                 # Amount of data scanned
    # - planning_time              # Optional: query planning time
    # - scheduling_time            # Optional: query scheduling time
    # - blocked_time               # Optional: time blocked on resources
  
  # --------------------------------------------------------------------------
  # Metadata / Tags
  # --------------------------------------------------------------------------
  metadata:
    suite: complete-reference      # Suite identifier
    benchmark: example             # Benchmark name
    benchmark_version: "1.0"       # Benchmark version
    scale_factor: "1"              # Data scale factor
    environment: development       # Environment (dev, staging, prod)
    purpose: reference             # Purpose of suite
    owner: your-name               # Suite owner
    # custom_tag: custom_value     # Any custom metadata
  
  # --------------------------------------------------------------------------
  # Advanced Options
  # --------------------------------------------------------------------------
  # parallel_queries: 1            # Optional: number of queries to run in parallel
  # query_order: sequential        # Optional: sequential, random, optimized
  # cache_warming: false           # Optional: warm caches before measurements
  # result_caching: false          # Optional: disable result caching
  # adaptive_timeout: true         # Optional: adjust timeout based on query complexity

# ============================================================================
# EXPERIMENTS
# ============================================================================
# List of experiments to run in this suite
experiments:
  
  # --------------------------------------------------------------------------
  # Example 1: Minimal (inherits all defaults)
  # --------------------------------------------------------------------------
  - path: ../my-experiment-1.yaml
    description: "Simple experiment using all suite defaults"
  
  # --------------------------------------------------------------------------
  # Example 2: Override execution parameters
  # --------------------------------------------------------------------------
  - path: ../my-experiment-2.yaml
    runs: 10                       # Override: more runs for this experiment
    warmup_runs: 3                 # Override: more warmup runs
    timeout_seconds: 600           # Override: longer timeout
    description: "Complex query needs more runs and longer timeout"
  
  # --------------------------------------------------------------------------
  # Example 3: Override connection (different schema/scale)
  # --------------------------------------------------------------------------
  - path: ../my-experiment-3.yaml
    connection:
      schema: sf10                 # Override: use larger dataset
    timeout_seconds: 1200
    description: "Test on larger dataset"
  
  # --------------------------------------------------------------------------
  # Example 4: Override validation rules
  # --------------------------------------------------------------------------
  - path: ../my-experiment-4.yaml
    validation:
      min_success_rate: 0.80       # Override: lower success rate requirement
      max_execution_time_variance: 0.5  # Override: allow more variance
    description: "Experimental query with relaxed validation"
  
  # --------------------------------------------------------------------------
  # Example 5: Disable monitoring for lightweight test
  # --------------------------------------------------------------------------
  - path: ../my-experiment-5.yaml
    runs: 1
    warmup_runs: 0
    monitoring:
      enabled: false               # Override: disable monitoring
    description: "Quick smoke test without monitoring overhead"
  
  # --------------------------------------------------------------------------
  # Example 6: Add custom metadata
  # --------------------------------------------------------------------------
  - path: ../my-experiment-6.yaml
    metadata:
      experimental: true           # Add: custom metadata
      feature: new_optimizer       # Add: feature being tested
      jira_ticket: "PROJ-123"      # Add: tracking reference
    description: "Test new optimizer feature"
  
  # --------------------------------------------------------------------------
  # Example 7: Override multiple settings
  # --------------------------------------------------------------------------
  - path: ../my-experiment-7.yaml
    runs: 5
    warmup_runs: 2
    timeout_seconds: 900
    connection:
      schema: sf100
    validation:
      min_success_rate: 0.90
    monitoring:
      interval_seconds: 10
    metadata:
      scale_factor: "100"
      dataset_size: "100GB"
    description: "Large-scale test with multiple overrides"
  
  # --------------------------------------------------------------------------
  # Example 8: Different system (if you have multiple systems)
  # --------------------------------------------------------------------------
  # - path: ../my-spark-experiment.yaml
  #   system: spark                # Override: use different system
  #   connection:
  #     master: local[4]
  #     app_name: my_spark_app
  #   description: "Compare with Spark engine"
  
  # --------------------------------------------------------------------------
  # Example 9: Inline query definition
  # --------------------------------------------------------------------------
  # - path: ../my-experiment-9.yaml
  #   queries:
  #     - "SELECT COUNT(*) FROM orders"
  #     - "SELECT AVG(price) FROM products"
  #   description: "Experiment with inline queries"
  
  # --------------------------------------------------------------------------
  # Example 10: Use query files
  # --------------------------------------------------------------------------
  # - path: ../my-experiment-10.yaml
  #   query_files:
  #     - "apps/tpch/queries/q01.sql"
  #     - "apps/tpch/queries/q06.sql"
  #   description: "Experiment using SQL files"

# ============================================================================
# CONFIGURATION HIERARCHY
# ============================================================================
# Settings are merged in this order (later overrides earlier):
#
# 1. Suite defaults (this file's `defaults:` section)
# 2. Experiment YAML file (the file referenced in `path:`)
# 3. Per-experiment overrides (settings under each experiment in this file)
# 4. CLI flags (--runs, --timeout, etc.)
#
# Example:
#   Suite default:     runs: 3
#   Experiment YAML:   runs: 5
#   Suite override:    runs: 10
#   CLI flag:          --runs 20
#   → Result: 20 runs (CLI wins)

# ============================================================================
# VALIDATION DETAILS
# ============================================================================
# 
# min_success_rate:
#   - Range: 0.0 to 1.0 (0% to 100%)
#   - Example: 0.95 means at least 95% of queries must succeed
#   - Failed queries include: errors, timeouts, crashes
#
# max_execution_time_variance:
#   - Coefficient of Variation (CV) = standard_deviation / mean
#   - Range: 0.0 to 1.0+ (0% to 100%+)
#   - Example: 0.2 means execution times can vary by up to 20%
#   - Lower = more consistent performance
#   - Used to detect performance instability

# ============================================================================
# MONITORING DETAILS
# ============================================================================
#
# Available metrics:
#   - cpu_usage:        CPU utilization percentage (0-100%)
#   - memory_usage:     Memory usage in bytes
#   - disk_io:          Disk I/O operations per second
#   - network_io:       Network I/O bytes per second
#   - query_queue:      Number of queued queries
#   - active_queries:   Number of currently executing queries
#   - gc_time:          Garbage collection time (JVM)
#
# interval_seconds:
#   - How often to collect metrics
#   - Lower = more granular data, higher overhead
#   - Recommended: 5-10 seconds for production
#   - Use 1-2 seconds for detailed profiling

# ============================================================================
# METADATA / TAGGING
# ============================================================================
#
# Use metadata for:
#   - Organizing experiments
#   - Filtering results
#   - Analysis and reporting
#   - Tracking provenance
#   - Documentation
#
# Common metadata keys:
#   - suite: suite identifier
#   - benchmark: benchmark name (TPC-H, TPC-DS, etc.)
#   - scale_factor: data size (1, 10, 100, etc.)
#   - environment: dev, staging, production
#   - purpose: testing, regression, performance, etc.
#   - owner: who owns this experiment
#   - jira_ticket: tracking reference
#   - git_commit: code version
#   - feature: feature being tested

# ============================================================================
# TIPS & BEST PRACTICES
# ============================================================================
#
# 1. Start Simple:
#    - Begin with minimal configuration
#    - Add complexity only when needed
#    - Test with --dry-run first
#
# 2. Use Appropriate Run Counts:
#    - Development: 1-2 runs
#    - Testing: 3-5 runs
#    - Production benchmarks: 10+ runs
#    - Regression tests: 10-20 runs
#
# 3. Set Realistic Timeouts:
#    - Too short: queries fail unnecessarily
#    - Too long: wastes time on stuck queries
#    - Start with 2x expected time, adjust based on results
#
# 4. Monitor Appropriately:
#    - Enable for performance analysis
#    - Disable for quick smoke tests
#    - Use longer intervals for long-running tests
#
# 5. Validate Appropriately:
#    - Strict (0.95+) for production
#    - Relaxed (0.80-0.90) for development
#    - Consider query complexity
#
# 6. Use Meaningful Metadata:
#    - Tag experiments for easy filtering
#    - Include version/commit information
#    - Document purpose and context
#
# 7. Organize Experiments:
#    - Group related experiments in same suite
#    - Order by complexity or expected runtime
#    - Use descriptive paths and descriptions

# ============================================================================
# COMMON PATTERNS
# ============================================================================
#
# Pattern 1: Quick Smoke Test
# defaults:
#   runs: 1
#   warmup_runs: 0
#   timeout_seconds: 60
#   monitoring: { enabled: false }
#
# Pattern 2: Production Benchmark
# defaults:
#   runs: 10
#   warmup_runs: 3
#   timeout_seconds: 1800
#   monitoring: { enabled: true, interval_seconds: 5 }
#   validation: { min_success_rate: 0.98 }
#
# Pattern 3: Development Testing
# defaults:
#   runs: 2
#   warmup_runs: 1
#   timeout_seconds: 300
#   validation: { min_success_rate: 0.90 }
#
# Pattern 4: Regression Testing
# defaults:
#   runs: 20
#   warmup_runs: 5
#   validation: { min_success_rate: 0.98, max_execution_time_variance: 0.15 }
#   monitoring: { enabled: true, interval_seconds: 2 }

# ============================================================================
# EXAMPLE USAGE
# ============================================================================
#
# Run suite:
#   tribench suite run experiments/suites/my-suite.yaml
#
# Run with overrides:
#   tribench suite run my-suite.yaml --runs 10 --timeout 600
#
# Dry run (validate without executing):
#   tribench suite run my-suite.yaml --dry-run
#
# Run specific experiments:
#   tribench suite run my-suite.yaml --exp experiment-1
#
# Run with verbose logging:
#   tribench suite run my-suite.yaml --verbose
#
# List available suites:
#   tribench suite list
#
# Show suite details:
#   tribench suite show my-suite.yaml

