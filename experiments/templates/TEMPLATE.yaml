# ============================================================================
# Experiment Template for TriBench Framework
# ============================================================================
#
# This template demonstrates all available configuration options for creating
# benchmark experiments. Copy this file and customize for your needs.
#
# Quick Start:
#   1. Set name and description (REQUIRED)
#   2. Set system (currently only "trino" supported)
#   3. Add queries (inline or via query_files)
#   4. Adjust connection, execution, and validation parameters
#   5. Run: tribench exp run your-experiment.yaml
#
# ============================================================================

# ----------------------------------------------------------------------------
# REQUIRED FIELDS
# ----------------------------------------------------------------------------

name: "my-experiment"
description: "Brief description of what this experiment measures"
system: "trino"  # System to run queries against (currently only "trino")

# ----------------------------------------------------------------------------
# DATASET (Optional but recommended for database tracking)
# ----------------------------------------------------------------------------

# Option 1: Top-level dataset field
dataset: "tpch-sf1"  # Dataset identifier for tracking

# Option 2: Use metadata.dataset (checked if top-level dataset is not set)
# See metadata section below

# ----------------------------------------------------------------------------
# CONNECTION PARAMETERS (Optional - uses defaults if not specified)
# ----------------------------------------------------------------------------

connection:
  host: "localhost"      # Trino coordinator host (default: localhost)
  port: 8080            # Trino HTTP port (default: 8080)
  user: "tribench"      # Username for Trino connection (default: tribench)
  catalog: "tpch"       # Trino catalog to use (default: memory)
  schema: "sf1"         # Schema within catalog (default: default)

# ----------------------------------------------------------------------------
# EXECUTION PARAMETERS (Optional - shown with defaults)
# ----------------------------------------------------------------------------

runs: 3                   # Number of measured runs (default: 1)
                         # Recommendation: 3-10 for statistical significance

warmup_runs: 1           # Warmup runs before measurement (default: 0)
                         # Recommendation: 1-2 to prime caches

timeout_seconds: 300     # Query timeout in seconds (default: 300)
                         # Adjust based on query complexity

max_retries: 3           # Max retry attempts on failure (default: 3)

# ----------------------------------------------------------------------------
# QUERIES - Choose at least one method
# ----------------------------------------------------------------------------

# Method 1: Inline SQL queries
queries:
  - |
    SELECT 
        COUNT(*) as total_rows,
        SUM(column1) as sum_col1
    FROM 
        my_table
    WHERE 
        date_column > DATE '2024-01-01'
  
  - |
    SELECT 
        category,
        AVG(value) as avg_value
    FROM 
        another_table
    GROUP BY 
        category
    ORDER BY 
        avg_value DESC
    LIMIT 10

# Method 2: Load queries from files
query_files:
  - "queries/tpch/q01.sql"
  - "queries/tpch/q02.sql"
  - "queries/custom/analysis.sql"

# Note: You can use both methods together - all queries will be executed

# ----------------------------------------------------------------------------
# VALIDATION RULES (Optional but recommended)
# ----------------------------------------------------------------------------

validation:
  # Minimum success rate (0.0 to 1.0)
  min_success_rate: 0.95
  # Example: 0.95 means at least 95% of runs must succeed
  
  # Maximum execution time variance (Coefficient of Variation)
  max_execution_time_variance: 0.3
  # Example: 0.3 means execution times should not vary more than 30%
  # Lower values = more reproducible results

# ----------------------------------------------------------------------------
# METRICS TO COLLECT (Optional - shown with defaults)
# ----------------------------------------------------------------------------

metrics:
  - execution_time      # Query execution time
  - rows_returned       # Number of rows returned
  - cpu_time           # CPU time used
  - memory_usage       # Peak memory usage
  - data_scanned       # Amount of data scanned

# Available metrics (automatically collected when available):
# - execution_time, planning_time, analysis_time
# - rows_returned, input_rows, output_rows
# - cpu_time, scheduled_time, blocked_time
# - memory_usage, peak_memory_bytes
# - data_scanned, input_bytes, output_bytes, physical_input_bytes

# ----------------------------------------------------------------------------
# METADATA (Optional but useful for organization and tracking)
# ----------------------------------------------------------------------------

metadata:
  # Dataset information (used if top-level dataset not set)
  dataset: "tpch-tiny-iceberg"
  dataset_location: "iceberg.tpch"
  
  # Benchmark information
  benchmark: "TPC-H"
  scale_factor: 1
  query_number: 1
  query_name: "Pricing Summary Report"
  
  # Expected results (for validation)
  expected_rows: 4
  expected_checksum: "abc123def456"
  
  # Categorization
  tags: ["benchmark", "tpch", "aggregation", "performance"]
  category: "olap"
  purpose: "Performance baseline measurement"
  
  # Environment information
  format: "iceberg"
  compression: "snappy"
  partitioning: "by_year"
  
  # Custom fields (add any additional metadata)
  author: "Your Name"
  ticket: "JIRA-123"
  notes: "Testing new optimization"

# ============================================================================
# USAGE EXAMPLES
# ============================================================================
#
# Run with default settings:
#   tribench exp run experiments/my-experiment.yaml
#
# Override execution parameters:
#   tribench exp run experiments/my-experiment.yaml --runs 10 --warmup 3
#
# Dry run (validate without executing):
#   tribench exp run experiments/my-experiment.yaml --dry-run
#
# Disable monitoring:
#   tribench exp run experiments/my-experiment.yaml --no-monitoring
#
# Save results as JSON files (in addition to database):
#   tribench exp run experiments/my-experiment.yaml --save-json
#
# Disable all storage (monitoring only):
#   tribench exp run experiments/my-experiment.yaml --no-storage
#
# ============================================================================
# RESULT STORAGE
# ============================================================================
#
# By default, results are stored in the database (results/tribench.db)
#
# View experiments:
#   tribench res list
#
# Show experiment details:
#   tribench res show <experiment-name-or-id>
#
# Show experiment runs:
#   tribench res show <id> --runs
#
# View monitoring metrics:
#   tribench res monitoring <run-id> --summary
#
# Export results:
#   tribench res export <experiment-id> --format csv --output results.csv
#
# Compare experiments:
#   tribench res compare <id1> <id2> <id3>
#
# ============================================================================
# TIPS AND BEST PRACTICES
# ============================================================================
#
# 1. Experiment Naming:
#    - Use descriptive, unique names
#    - Include key parameters: "tpch-q1-sf10-iceberg"
#    - Avoid special characters except hyphens and underscores
#
# 2. Query Design:
#    - Test queries individually first
#    - Use warmup runs for cache-sensitive benchmarks
#    - Set appropriate timeouts for long-running queries
#
# 3. Execution Configuration:
#    - Single run for quick tests
#    - 3-5 runs for basic benchmarks
#    - 10+ runs for rigorous performance analysis
#    - Use warmup_runs for steady-state measurements
#
# 4. Validation:
#    - Set min_success_rate to catch flaky queries
#    - Use max_execution_time_variance to ensure reproducibility
#    - Start lenient, tighten as needed
#
# 5. Metadata:
#    - Document important context
#    - Use tags for categorization
#    - Include dataset and format information
#    - Add notes about special conditions
#
# 6. Organization:
#    - Group related experiments in subdirectories
#    - Keep query files in experiments/queries/
#    - Use suites for running multiple experiments
#
# ============================================================================
