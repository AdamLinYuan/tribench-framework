name: "tpcds-dev"
description: "TPC-DS Development - Quick validation with simple queries"
system: "trino"
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpcds"
runs: 1
warmup_runs: 0
timeout_seconds: 300
max_retries: 1
query_files:
  - "queries/tpcds/queries/q01.sql"
  - "queries/tpcds/queries/q02.sql"
  - "queries/tpcds/queries/q03.sql"
  - "queries/tpcds/queries/q04.sql"
  - "queries/tpcds/queries/q05.sql"
  - "queries/tpcds/queries/q06.sql"
  - "queries/tpcds/queries/q07.sql"
  - "queries/tpcds/queries/q08.sql"
  - "queries/tpcds/queries/q09.sql"
monitoring:
  enabled: false
metadata:
  benchmark: "TPC-DS"
  scale_factor: 1
  dataset: "tpcds-sf1"
  format: "iceberg"
  tags: ["tpcds", "development", "quick-test"]
