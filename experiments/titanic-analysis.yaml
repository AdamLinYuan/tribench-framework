name: "titanic-survival-analysis"
description: "Analyze Titanic passenger survival patterns"

system: "trino"

connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "boat"

runs: 3
warmup_runs: 1
timeout_seconds: 60

queries:
  - name: "q1_overall_survival"
    description: "Overall survival rate"
    sql: |
      SELECT 
        COUNT(*) AS total_passengers,
        SUM(Survived) AS survivors,
        ROUND(100.0 * SUM(Survived) / COUNT(*), 2) AS survival_rate_pct
      FROM titanic

  - name: "q2_survival_by_class"
    description: "Survival rates by passenger class"
    sql: |
      SELECT 
        Pclass AS passenger_class,
        COUNT(*) AS total,
        SUM(Survived) AS survivors,
        ROUND(100.0 * SUM(Survived) / COUNT(*), 2) AS survival_rate_pct
      FROM titanic
      GROUP BY Pclass
      ORDER BY Pclass

  - name: "q3_survival_by_gender"
    description: "Survival rates by gender"
    sql: |
      SELECT 
        Sex AS gender,
        COUNT(*) AS total,
        SUM(Survived) AS survivors,
        ROUND(100.0 * SUM(Survived) / COUNT(*), 2) AS survival_rate_pct
      FROM titanic
      GROUP BY Sex
      ORDER BY survival_rate_pct DESC

  - name: "q4_survival_by_class_and_gender"
    description: "Survival rates by class and gender"
    sql: |
      SELECT 
        Pclass AS passenger_class,
        Sex AS gender,
        COUNT(*) AS total,
        SUM(Survived) AS survivors,
        ROUND(100.0 * SUM(Survived) / COUNT(*), 2) AS survival_rate_pct
      FROM titanic
      GROUP BY Pclass, Sex
      ORDER BY Pclass, Sex

  - name: "q5_age_distribution"
    description: "Age distribution of passengers"
    sql: |
      SELECT 
        CASE 
          WHEN Age IS NULL THEN 'Unknown'
          WHEN Age < 18 THEN 'Child (0-17)'
          WHEN Age < 30 THEN 'Young Adult (18-29)'
          WHEN Age < 50 THEN 'Adult (30-49)'
          ELSE 'Senior (50+)'
        END AS age_group,
        COUNT(*) AS total,
        SUM(Survived) AS survivors,
        ROUND(100.0 * SUM(Survived) / COUNT(*), 2) AS survival_rate_pct
      FROM titanic
      GROUP BY 
        CASE 
          WHEN Age IS NULL THEN 'Unknown'
          WHEN Age < 18 THEN 'Child (0-17)'
          WHEN Age < 30 THEN 'Young Adult (18-29)'
          WHEN Age < 50 THEN 'Adult (30-49)'
          ELSE 'Senior (50+)'
        END
      ORDER BY survival_rate_pct DESC

  - name: "q6_fare_analysis"
    description: "Fare distribution by survival status"
    sql: |
      SELECT 
        Survived,
        COUNT(*) AS passengers,
        ROUND(AVG(Fare), 2) AS avg_fare,
        ROUND(MIN(Fare), 2) AS min_fare,
        ROUND(MAX(Fare), 2) AS max_fare,
        ROUND(STDDEV(Fare), 2) AS stddev_fare
      FROM titanic
      WHERE Fare > 0
      GROUP BY Survived
      ORDER BY Survived

  - name: "q7_family_size_impact"
    description: "Impact of family size on survival"
    sql: |
      SELECT 
        SibSp + Parch AS family_size,
        COUNT(*) AS passengers,
        SUM(Survived) AS survivors,
        ROUND(100.0 * SUM(Survived) / COUNT(*), 2) AS survival_rate_pct
      FROM titanic
      GROUP BY SibSp + Parch
      ORDER BY family_size

  - name: "q8_embarkation_port"
    description: "Survival rates by embarkation port"
    sql: |
      SELECT 
        CASE 
          WHEN Embarked = 'C' THEN 'Cherbourg'
          WHEN Embarked = 'Q' THEN 'Queenstown'
          WHEN Embarked = 'S' THEN 'Southampton'
          ELSE 'Unknown'
        END AS embarkation_port,
        COUNT(*) AS total,
        SUM(Survived) AS survivors,
        ROUND(100.0 * SUM(Survived) / COUNT(*), 2) AS survival_rate_pct
      FROM titanic
      GROUP BY Embarked
      ORDER BY survival_rate_pct DESC

  - name: "q9_first_class_survivors"
    description: "First class passenger survival details"
    sql: |
      SELECT 
        Name,
        Sex,
        Age,
        Ticket,
        Fare,
        Embarked
      FROM titanic
      WHERE Pclass = 1 AND Survived = 1
      ORDER BY Fare DESC
      LIMIT 20

  - name: "q10_complex_analysis"
    description: "Complex multi-dimensional survival analysis"
    sql: |
      SELECT 
        Pclass,
        Sex,
        CASE 
          WHEN Age < 18 THEN 'Child'
          ELSE 'Adult'
        END AS age_category,
        COUNT(*) AS total,
        SUM(Survived) AS survivors,
        ROUND(100.0 * SUM(Survived) / COUNT(*), 2) AS survival_rate_pct,
        ROUND(AVG(Fare), 2) AS avg_fare
      FROM titanic
      WHERE Age IS NOT NULL
      GROUP BY Pclass, Sex, 
        CASE 
          WHEN Age < 18 THEN 'Child'
          ELSE 'Adult'
        END
      ORDER BY survival_rate_pct DESC

result_storage:
  enable_database: true
  enable_json: true
  output_dir: "results"
