# RQ1 Dimension: Parallel Execution Test - Parallel Mode
# Tests query execution performance with parallel execution (parallel=4)

name: "parallel-execution-parallel"
description: "Test with parallel query execution (parallel=4)"

# System configuration
system: "trino"

# Connection parameters
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

# Execution parameters
runs: 10  # Statistical consistency
warmup_runs: 2  # Stabilize JIT
timeout_seconds: 600
max_retries: 1

# Parallel execution - PARALLEL (4 concurrent queries)
parallel_queries: 4

# Monitoring configuration
monitoring:
  enabled: true
  interval_seconds: 1.0
  
  kubernetes:
    enabled: true
    context: "gke_tribench-project_us-central1_tribench-cluster"
    namespace: "tribench"
    label_selector: "app=trino"
    pod_name_pattern: "trino-.*"

# Query selection: SAME queries as sequential test for fair comparison
query_files:
  - "apps/tpch/queries/q01.sql"  # Simple scan
  - "apps/tpch/queries/q03.sql"  # Medium join
  - "apps/tpch/queries/q06.sql"  # Simple filter
  - "apps/tpch/queries/q09.sql"  # Complex join

# Validation
validation:
  min_success_rate: 1.0

# Metadata for analysis
metadata:
  benchmark: "tpch"
  scale_factor: "sf1"
  parallel_mode: "parallel-4"
  tags:
    - "rq1"
    - "parallel-execution"
    - "parallel-4"
    - "gke"
