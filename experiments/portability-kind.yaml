# RQ1 Dimension 2: Infrastructure Portability Test - Kind (Local Kubernetes)
# Tests consistent behavior on local Kubernetes

name: "portability-kind"
description: "Infrastructure portability validation on Kind cluster"

# System configuration
system: "trino"

# Connection parameters
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

# Execution parameters
runs: 10  # Statistical consistency
warmup_runs: 2  # Stabilize JIT for fair comparison
timeout_seconds: 300
max_retries: 1

# Monitoring configuration
monitoring:
  enabled: true
  interval_seconds: 1.0
  
  kubernetes:
    enabled: true
    context: "kind-tribench"
    namespace: "tribench"
    label_selector: "app=trino"
    pod_name_pattern: "trino-.*"

# Query selection: Simple, Medium, Complex
query_files:
  - "queries/tpch/queries/q01.sql"  # Simple scan
  - "queries/tpch/queries/q06.sql"  # Simple scan with filter
  - "queries/tpch/queries/q03.sql"  # Medium join
  - "queries/tpch/queries/q12.sql"  # Medium join with aggregation
  - "queries/tpch/queries/q09.sql"  # Complex 6-table join
  - "queries/tpch/queries/q18.sql"  # Complex join with subquery

# Validation
validation:
  min_success_rate: 1.0
  result_comparison: true
