name: "tpcds-sf1"
description: "TPC-DS Decision Support Benchmark - Scale Factor 1 (1GB)"
system: "trino"
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpcds"
runs: 3
warmup_runs: 1
timeout_seconds: 600
max_retries: 2
query_files:
  - "queries/tpcds/queries/q01.sql"
  - "queries/tpcds/queries/q03.sql"
  - "queries/tpcds/queries/q07.sql"
  - "queries/tpcds/queries/q19.sql"
  - "queries/tpcds/queries/q27.sql"
  - "queries/tpcds/queries/q42.sql"
  - "queries/tpcds/queries/q52.sql"
  - "queries/tpcds/queries/q55.sql"
  - "queries/tpcds/queries/q73.sql"
  - "queries/tpcds/queries/q96.sql"
monitoring:
  enabled: true
  interval_seconds: 5.0
metadata:
  benchmark: "TPC-DS"
  scale_factor: 1
  dataset: "tpcds-sf1"
  format: "iceberg"
  tags: ["tpcds", "decision-support", "sf1"]
