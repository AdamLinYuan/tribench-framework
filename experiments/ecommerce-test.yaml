name: "ecommerce-test"
description: "Test custom e-commerce dataset with simple queries"

system: "trino"

connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "ecommerce"

runs: 3
warmup_runs: 1
timeout_seconds: 300

queries:
  - name: "q1_customer_count"
    description: "Count total customers"
    sql: |
      SELECT COUNT(*) AS total_customers
      FROM customers

  - name: "q2_revenue_by_country"
    description: "Total revenue by country"
    sql: |
      SELECT 
        c.country,
        COUNT(DISTINCT o.order_id) AS order_count,
        SUM(o.total_amount) AS total_revenue,
        AVG(o.total_amount) AS avg_order_value
      FROM customers c
      JOIN orders o ON c.customer_id = o.customer_id
      WHERE o.status = 'delivered'
      GROUP BY c.country
      ORDER BY total_revenue DESC

  - name: "q3_products_by_category"
    description: "Product counts and average price by category"
    sql: |
      SELECT 
        category,
        COUNT(*) AS product_count,
        AVG(price) AS avg_price,
        MIN(price) AS min_price,
        MAX(price) AS max_price
      FROM products
      GROUP BY category
      ORDER BY product_count DESC

  - name: "q4_order_status_distribution"
    description: "Distribution of order statuses"
    sql: |
      SELECT 
        status,
        COUNT(*) AS order_count,
        SUM(total_amount) AS total_amount,
        AVG(total_amount) AS avg_amount
      FROM orders
      GROUP BY status
      ORDER BY order_count DESC

  - name: "q5_top_customers"
    description: "Top 10 customers by total spend"
    sql: |
      SELECT 
        c.customer_id,
        c.name,
        c.country,
        c.segment,
        COUNT(o.order_id) AS order_count,
        SUM(o.total_amount) AS total_spent
      FROM customers c
      JOIN orders o ON c.customer_id = o.customer_id
      WHERE o.status IN ('delivered', 'shipped')
      GROUP BY c.customer_id, c.name, c.country, c.segment
      ORDER BY total_spent DESC
      LIMIT 10

  - name: "q6_order_items_analysis"
    description: "Analyze order items with product details"
    sql: |
      SELECT 
        p.category,
        COUNT(DISTINCT oi.order_id) AS orders_with_category,
        SUM(oi.quantity) AS total_units_sold,
        SUM(oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100.0)) AS total_revenue
      FROM order_items oi
      JOIN products p ON oi.product_id = p.product_id
      GROUP BY p.category
      ORDER BY total_revenue DESC

result_storage:
  enable_database: true
  enable_json: true
  output_dir: "results"
