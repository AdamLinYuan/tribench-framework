# RQ1 Dimension 2: Infrastructure Portability Test - Docker (Local Baseline)
# Tests consistent behavior on local Docker

name: "portability-docker"
description: "Infrastructure portability baseline on Docker"

# System configuration
system: "trino"

# Connection parameters
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

# Execution parameters
runs: 10  # Statistical consistency
warmup_runs: 2  # Match Kind configuration for fair comparison
timeout_seconds: 300
max_retries: 1

# Monitoring configuration
monitoring:
  enabled: true
  interval_seconds: 1.0
  
  # Docker monitoring (no Kubernetes)
  kubernetes:
    enabled: false

# Query selection: MUST match Kind experiment exactly
query_files:
  - "apps/tpch/queries/q01.sql"  # Simple scan
  - "apps/tpch/queries/q06.sql"  # Simple scan with filter
  - "apps/tpch/queries/q03.sql"  # Medium join
  - "apps/tpch/queries/q12.sql"  # Medium join with aggregation
  - "apps/tpch/queries/q09.sql"  # Complex 6-table join
  - "apps/tpch/queries/q18.sql"  # Complex join with subquery

# Validation
validation:
  min_success_rate: 1.0
  result_comparison: true
