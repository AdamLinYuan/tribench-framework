# This experiment executes TPC-H queries against Iceberg-loaded
# dataset in Trino.

name: "tpch-q1-memory-tiny"
description: "TPC-H Query 1 - Pricing Summary Report on Iceberg dataset"

# System configuration
system: "trino"

# Connection parameters
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "memory"  # Changed from memory to iceberg
  schema: "tpch"      # Changed from default to tpch

# Execution parameters
runs: 1
warmup_runs: 1
timeout_seconds: 60
max_retries: 0

# TPC-H Query 1: Pricing Summary Report Query
query_files:
  - "apps/tpch/queries/q01.sql"
  - "apps/tpch/queries/q02.sql"
  - "apps/tpch/queries/q03.sql"
  - "apps/tpch/queries/q04.sql"
  - "apps/tpch/queries/q05.sql"
  - "apps/tpch/queries/q06.sql"
  - "apps/tpch/queries/q07.sql"
  - "apps/tpch/queries/q08.sql"
  - "apps/tpch/queries/q09.sql"
  - "apps/tpch/queries/q10.sql"
  - "apps/tpch/queries/q11.sql"
  - "apps/tpch/queries/q12.sql"
  - "apps/tpch/queries/q13.sql"
  - "apps/tpch/queries/q14.sql"
  - "apps/tpch/queries/q15.sql"
  - "apps/tpch/queries/q16.sql"
  - "apps/tpch/queries/q17.sql"
  - "apps/tpch/queries/q18.sql"
  - "apps/tpch/queries/q19.sql"
  - "apps/tpch/queries/q20.sql"
  - "apps/tpch/queries/q21.sql"
  - "apps/tpch/queries/q22.sql"

# Validation rules
validation:
  min_success_rate: 0.95
  max_execution_time_variance: 0.3

# Metrics to collect
metrics:
  - execution_time
  - rows_returned
  - cpu_time
  - memory_usage
  - data_scanned

# Metadata
metadata:
  benchmark: "TPC-H"
  query_number: 1
  query_name: "Pricing Summary Report"
  scale_factor: 0.01
  expected_rows: 4
  dataset: "tpch-tiny-iceberg"
  dataset_location: "iceberg.tpch"
  format: "iceberg"
  tags: ["tpch", "aggregation", "iceberg", "loaded-data"]
