# Sequential vs Parallel Execution Comparison Suite
# Compares performance between sequential and parallel query execution

name: "sequential-vs-parallel-suite"
description: "Compare sequential vs parallel TPC-H query execution with connection pooling"

experiments:
  - name: "sequential-baseline"
    config: "experiments/tpch-sequential-comparison.yaml"
    description: "Sequential execution baseline (1 query at a time)"
    
  - name: "parallel-pooled"
    config: "experiments/tpch-parallel-comparison.yaml"
    description: "Parallel execution with connection pooling (4 concurrent queries)"

# Suite-level settings
settings:
  continue_on_failure: true
  parallel_execution: false  # Run experiments sequentially for fair comparison
  
# Comparison metrics
comparison:
  baseline: "sequential-baseline"
  metrics:
    - "total_duration"
    - "avg_query_time"
    - "throughput"
    - "resource_utilization"
