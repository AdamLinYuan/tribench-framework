# TPC-H Experiment Suite
# Demonstrates suite-level configuration with hierarchical merging

name: tpch-suite
description: TPC-H benchmark queries with suite-level defaults

# Suite-level defaults - applied to all experiments
# Individual experiments can override these values
defaults:
  system: trino
  runs: 3
  warmup_runs: 1
  timeout_seconds: 300
  validation:
    min_success_rate: 0.95
  metadata:
    suite: tpch
    benchmark_version: "3.0"

# Experiments in this suite
experiments:  
  # Iceberg-based experiment
  - path: ../tpch-iceberg-tiny.yaml
    runs: 2
    description: "TPC-H queries on Iceberg format"



