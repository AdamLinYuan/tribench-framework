# ============================================================================
# TPC-H Demo Suite
# ============================================================================
# Comprehensive demo suite showcasing different query patterns and use cases
# 
# This suite includes:
#   1. Quick Smoke Test     - Fast validation (< 1 min)
#   2. Aggregation Demo     - GROUP BY and SUM patterns
#   3. Join Demo            - Multi-table join patterns
#   4. Subquery Demo        - EXISTS, IN, correlated subqueries
#   5. Analytical Demo      - Complex business intelligence queries
#   6. Top 5 Benchmark      - Representative comprehensive benchmark
#
# Total estimated time: ~15-20 minutes on SF0.01
# ============================================================================

name: "tpch-demo-suite"
description: "Comprehensive TPC-H demo suite showcasing query patterns and framework capabilities"
version: "1.0.0"

# Global defaults for all experiments in this suite
defaults:
  system: "trino"
  connection:
    host: "localhost"
    port: 8080
    user: "tribench"
    catalog: "iceberg"
    schema: "tpch"
  runs: 3
  warmup_runs: 1
  timeout_seconds: 180
  validation:
    min_success_rate: 0.90

# ============================================================================
# Experiment Stages
# ============================================================================
# Experiments run in order - smoke test first to validate connectivity

experiments:
  # Stage 1: Validate system is working
  - name: "smoke-test"
    path: "../demo/tpch-quick-smoke.yaml"
    description: "Quick connectivity and basic query validation"
    # Smoke test uses its own minimal settings

  # Stage 2: Simple query patterns
  - name: "aggregation"
    path: "../demo/tpch-aggregation-demo.yaml"
    description: "Aggregation-focused queries (Q1, Q6)"
    runs: 3
    warmup_runs: 1

  # Stage 3: Join performance  
  - name: "joins"
    path: "../demo/tpch-join-demo.yaml"
    description: "Multi-table join queries (Q3, Q5, Q10)"
    runs: 3
    warmup_runs: 1

  # Stage 4: Complex query patterns
  - name: "subqueries"
    path: "../demo/tpch-subquery-demo.yaml"
    description: "Subquery patterns (Q4, Q11, Q22)"
    runs: 3
    warmup_runs: 1

  # Stage 5: Analytical queries
  - name: "analytical"
    path: "../demo/tpch-analytical-demo.yaml"
    description: "Complex analytical queries (Q7, Q8, Q9)"
    runs: 3
    warmup_runs: 1

  # Stage 6: Comprehensive benchmark
  - name: "top5-benchmark"
    path: "../demo/tpch-top5-benchmark.yaml"
    description: "Top 5 representative TPC-H queries"
    runs: 5
    warmup_runs: 2

# ============================================================================
# Suite Configuration
# ============================================================================

execution:
  # Stop on first failure or continue with remaining experiments
  continue_on_failure: true
  # Delay between experiments (seconds) for system stabilization
  inter_experiment_delay: 5
  # Maximum parallel experiments (1 = sequential)
  max_parallel: 1

reporting:
  # Generate individual experiment reports
  per_experiment_report: true
  # Generate combined suite summary
  suite_summary: true
  # Comparison across experiments
  cross_experiment_comparison: true
  # Output formats
  formats:
    - json
    - markdown
    - html

output:
  # Results directory pattern
  directory: "results/demo-suite/{timestamp}"
  # Archive results after completion
  archive: true

metadata:
  benchmark: "TPC-H"
  scale_factor: 0.01
  dataset: "tpch-tiny"
  purpose: "Demo showcase of TriBench framework capabilities"
  tags: ["demo", "tpch", "iceberg", "comprehensive", "showcase"]
  author: "TriBench Framework"
  created: "2024"
