# RQ1 Dimension 2: Infrastructure Portability Test - GKE (Cloud Kubernetes)
# Tests consistent behavior on Google Kubernetes Engine

name: "portability-gke"
description: "Infrastructure portability validation on GKE cluster"

# System configuration
system: "trino"

# Connection parameters
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

# Execution parameters
runs: 10  # Statistical consistency
warmup_runs: 2  # Match Kind/Docker configuration
timeout_seconds: 300
max_retries: 1

# Monitoring configuration
monitoring:
  enabled: true
  interval_seconds: 1.0
  
  kubernetes:
    enabled: true
    context: "gke_tribench-project_us-central1_tribench-cluster"  # Update with actual GKE context
    namespace: "tribench"
    label_selector: "app=trino"
    pod_name_pattern: "trino-.*"

# Query selection: MUST match Kind and Docker experiments exactly
query_files:
  - "apps/tpch/queries/q01.sql"  # Simple scan
  - "apps/tpch/queries/q06.sql"  # Simple scan with filter
  - "apps/tpch/queries/q03.sql"  # Medium join
  - "apps/tpch/queries/q12.sql"  # Medium join with aggregation
  - "apps/tpch/queries/q09.sql"  # Complex 6-table join
  - "apps/tpch/queries/q18.sql"  # Complex join with subquery

# Validation
validation:
  min_success_rate: 1.0
  result_comparison: true
