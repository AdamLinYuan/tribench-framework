# TPC-H Query 1 Benchmark
#
# This experiment executes TPC-H Query 1 (Pricing Summary Report) against
# Trino's built-in TPC-H catalog at SF1 (Scale Factor 1 = ~1GB data).

name: "tpch-q1-sf1"
description: "TPC-H Query 1 - Pricing Summary Report at Scale Factor 1"

# System configuration
system: "trino"

# Connection parameters
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "tpch"
  schema: "sf1"  # Scale factor 1 (1GB)

# Execution parameters
runs: 10              # 5 measurement runs for statistical significance
warmup_runs: 2       # 2 warmup runs to prime caches
timeout_seconds: 300 # 5 minute timeout
max_retries: 3

# TPC-H Query 1: Pricing Summary Report Query
# This query reports the amount of business billed, shipped, and returned
queries:
  - |
    SELECT
        returnflag,
        linestatus,
        SUM(quantity) AS sum_qty,
        SUM(extendedprice) AS sum_base_price,
        SUM(extendedprice * (1 - discount)) AS sum_disc_price,
        SUM(extendedprice * (1 - discount) * (1 + tax)) AS sum_charge,
        AVG(quantity) AS avg_qty,
        AVG(extendedprice) AS avg_price,
        AVG(discount) AS avg_disc,
        COUNT(*) AS count_order
    FROM
        lineitem
    WHERE
        shipdate <= DATE '1998-09-02'
    GROUP BY
        returnflag,
        linestatus
    ORDER BY
        returnflag,
        linestatus

# Validation rules
validation:
  min_success_rate: 0.95        # At least 95% success rate
  max_execution_time_variance: 0.15  # Max 15% variance (tight for reproducibility)

# Metrics to collect
metrics:
  - execution_time
  - rows_returned
  - cpu_time
  - memory_usage
  - data_scanned
  - processed_rows

# Metadata
metadata:
  benchmark: "TPC-H"
  query_number: 1
  query_name: "Pricing Summary Report"
  scale_factor: "SF1"
  expected_rows: 4  # TPC-H Q1 always returns 4 rows
  dataset_size: "~1GB"
  tags: ["tpch", "aggregation", "benchmark"]
