# RQ1 Dimension: Parallel Execution Test - Sequential Mode (Kind)
# Tests query execution performance with sequential execution (parallel=1) on local Kind cluster

name: "parallel-execution-sequential-kind"
description: "Baseline test with sequential query execution (parallel=1) on Kind"

# System configuration
system: "trino"

# Connection parameters
connection:
  host: "localhost"
  port: 8080
  user: "tribench"
  catalog: "iceberg"
  schema: "tpch"

# Execution parameters
runs: 10  # Statistical consistency
warmup_runs: 2  # Stabilize JIT
timeout_seconds: 600
max_retries: 1

# Parallel execution - SEQUENTIAL (1 query at a time)
parallel_queries: 1

# Monitoring configuration
monitoring:
  enabled: true
  interval_seconds: 1.0
  
  kubernetes:
    enabled: true
    context: "kind-tribench"
    namespace: "tribench"
    label_selector: "app=trino"
    pod_name_pattern: "trino-.*"

# Query selection: Same queries for fair comparison
query_files:
  - "apps/tpch/queries/q01.sql"  # Simple scan
  - "apps/tpch/queries/q03.sql"  # Medium join
  - "apps/tpch/queries/q06.sql"  # Simple filter
  - "apps/tpch/queries/q09.sql"  # Complex join

# Validation
validation:
  min_success_rate: 1.0

# Metadata for analysis
metadata:
  benchmark: "tpch"
  scale_factor: "sf1"
  parallel_mode: "sequential"
  infrastructure: "kind-local"
  tags:
    - "rq1"
    - "parallel-execution"
    - "sequential"
    - "kind"
