name: tribench
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core framework
  - click=8.1.7
  - jinja2=3.1.2
  - pyyaml=6.0.1
  - requests=2.31.0
  - python-dotenv=1.0.0

  # Data processing and analysis
  - pandas=2.1.0
  - numpy=1.24.3
  - pyarrow=13.0.0

  # Database connectivity
  - psycopg2=2.9.7
  - sqlalchemy=2.0.21

  # Monitoring and metrics
  - psutil=5.9.5

  # Visualization and reporting
  - matplotlib=3.7.2
  - seaborn=0.12.2
  - plotly=5.16.1

  # Development and testing
  - jupyter=1.0.0
  - pytest=7.4.2
  - pytest-cov=4.1.0
  - black=23.7.0
  - flake8=6.0.0

  # Utilities
  - docker-py=6.1.3
  - schedule=1.2.0

  # Optional: Advanced features
  - scikit-learn=1.3.0
  - scipy=1.11.2

  # Pip-only dependencies (not available in conda or better via pip)
  - pip
  - pip:
    - trino==0.325.0
    - pyhocon==0.3.60
    - prometheus-client==0.17.1
    - kubernetes==27.2.0

# =============================================================================
# SYSTEM PREREQUISITES (install before creating conda environment)
# =============================================================================
# 
# Required (All platforms):
#   - Homebrew package manager: https://brew.sh
#   - Xcode Command Line Tools: xcode-select --install
#   - Git: brew install git
# 
# Required (Docker backend):
#   brew install --cask docker          # Docker Desktop (includes Docker Compose)
# 
# Required (Kubernetes backend):
#   brew install kubectl                # Kubernetes CLI
#   brew install helm                   # Helm package manager
# 
# Optional (Local Kubernetes):
#   brew install kind                   # Kind (Kubernetes in Docker)
# 
# Optional (GCP/GKE deployments):
#   brew install --cask google-cloud-sdk  # gcloud CLI
# 
# Optional (MinIO operations):
#   brew install minio/stable/mc        # MinIO Client
# 
# System Libraries (handled by conda, but listed for reference):
#   - PostgreSQL client libraries (libpq) - included via psycopg2 conda package
#   - OpenSSL - included via conda
#   - Python development headers - included via conda python package
# 
# =============================================================================
# CONDA ENVIRONMENT SETUP
# =============================================================================
# 
# 1. Create environment: conda env create -f environment.yml
# 2. Activate environment: conda activate tribench
# 3. Install tribench: pip install -e .
# 4. Verify installation: tribench --version
# 
# Update environment: conda env update -f environment.yml --prune
# Remove environment: conda env remove -n tribench